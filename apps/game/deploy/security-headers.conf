# Kitchen Quest game: headers for the sign-in page. Include inside the game's `server { }` block.
# See plans/m3-game/step-11.md. The magic link carries its token in the URL, so the page must never send it
# in a Referer header, no cache may keep a copy, no other site may frame it (clickjacking on "Sign me in"),
# and the access log must not record the query string. The page also sets <meta name="referrer"> itself and
# refuses to run inside a frame; the Vite dev and preview servers send the same headers
# (apps/game/build/headers-plugin.ts). Deployment is a later milestone.
#
# NOTE: nginx's add_header is not additive. Any add_header in this location REPLACES every add_header
# inherited from the server (or http) level, so server-wide headers (HSTS, nosniff, ...) must be repeated
# here. Keep them in one shared snippet, e.g. `include snippets/kq-common-headers.conf;`, and include it
# both at server level and in this location.
location ^~ /auth/verify {
    # The request line is `GET /auth/verify?token=...`: never log it. (Or use a log_format that logs $uri,
    # not $request / $request_uri.)
    access_log off;

    # Repeat the server-level headers here (see NOTE above), e.g.:
    # include snippets/kq-common-headers.conf;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri $uri/ /auth/verify/index.html;
}
