# Kitchen Quest game: headers for the sign-in page. Include inside the game's `server { }` block.
# See plans/m3-game/step-11.md. The magic link carries its token in the URL, so the page must never send it
# in a Referer header and no cache may keep a copy. The page also sets <meta name="referrer"> itself, and the
# Vite dev and preview servers do the same (apps/game/build/headers-plugin.ts). Deployment is a later milestone.
location ^~ /auth/verify {
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /auth/verify/index.html;
}
