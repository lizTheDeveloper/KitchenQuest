<!doctype html>
<html lang="en">
  <head>
    <meta name="referrer" content="no-referrer" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'" />
    <meta name="theme-color" content="#1e1b1d" />
    <meta name="robots" content="noindex" />
    <title>Sign in · Kitchen Quest</title>
  </head>
  <body>
    <!-- Step 11. The sign-in link lands here. Nothing is sent until the player taps the button (login CSRF);
         the token is read once, then removed from the address bar. This page never registers the service
         worker, which treats /auth/* as network-only. -->
    <main id="verify-main" class="verify-page">
      <noscript><p>Kitchen Quest needs JavaScript to finish signing in.</p></noscript>
    </main>
    <script type="module" src="/src/auth/verify-main.ts"></script>
  </body>
</html>
