<title>Kitchen Quest Recipe Trail</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@400;600&family=VT323&display=swap">
<style>
:root {
  color-scheme: dark;
  --iron: #1e1b1d;
  --iron-2: #2b2629;
  --iron-edge: #4a4044;
  --parchment: #f2e3c2;
  --parchment-ink: #2a1d14;
  --ember: #e8743b;
  --herb: #6fae4f;
  --saffron: #f2c14e;
  --chili: #c8423a;
  --sky: #6aa6d8;
  --fg: #efe6d8;
  --muted: #a89a8e;
  --shade: rgb(0 0 0 / .55);
  --display: "Pixelify Sans", "Courier New", monospace;
  --body: "Atkinson Hyperlegible", system-ui, sans-serif;
  --mono: "VT323", "Courier New", monospace;
  --px: 0 0 0 3px var(--iron-edge), 0 0 0 6px var(--iron);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--iron); color: var(--fg); }
body { font-family: var(--body); font-size: 17px; line-height: 1.45; overflow-x: hidden; }
img { image-rendering: pixelated; }
button { font: inherit; }
:focus-visible { outline: 3px solid var(--saffron); outline-offset: 3px; }

.wrap {
  max-width: 900px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 12px; padding-bottom: 48px;
}

/* HUD */
.hud { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; background: var(--iron-2); box-shadow: var(--px); margin: 6px 6px 18px; padding: 8px 12px; }
.hud .title { font-family: var(--display); font-weight: 600; color: var(--ember); font-size: 18px; margin-right: auto; }
.hud .lv { font-family: var(--display); font-size: 15px; }
.xpbar { width: 110px; height: 12px; background: var(--iron); box-shadow: 0 0 0 2px var(--iron-edge); position: relative; }
.xpbar i { position: absolute; inset: 0 auto 0 0; background: var(--ember); width: 0; transition: width .4s steps(8); }
.hud .num { font-family: var(--mono); font-size: 21px; line-height: 1; }
.badge { font-family: var(--mono); font-size: 17px; padding: 1px 7px; box-shadow: 0 0 0 2px var(--iron-edge); color: var(--muted); }
.badge.live { color: var(--herb); box-shadow: 0 0 0 2px var(--herb); }

/* breadcrumb */
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 6px 14px; font-family: var(--display); font-size: 14px; color: var(--muted); }
.crumbs button.link { background: none; border: 0; color: var(--saffron); padding: 2px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-family: var(--display); font-size: 14px; }
.crumbs .sep { color: var(--iron-edge); }
.crumbs .here { color: var(--fg); }

/* Buttons */
.btn { font-family: var(--display); font-size: 16px; border: 0; cursor: pointer; padding: 10px 16px; color: var(--parchment-ink); background: var(--ember); box-shadow: 0 0 0 3px var(--parchment-ink), 0 4px 0 3px var(--parchment-ink); margin: 6px 4px 10px; position: relative; }
.btn:active { transform: translateY(2px); box-shadow: 0 0 0 3px var(--parchment-ink), 0 2px 0 3px var(--parchment-ink); }
.btn.sec { background: var(--iron-2); color: var(--fg); box-shadow: 0 0 0 3px var(--iron-edge), 0 4px 0 3px var(--iron); }
.btn.sec:active { box-shadow: 0 0 0 3px var(--iron-edge), 0 2px 0 3px var(--iron); }
.btn.small { font-size: 14px; padding: 6px 10px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }

/* Game screen */
.screen { position: relative; box-shadow: var(--px); margin: 6px 6px 22px; background: var(--iron-2); overflow: hidden; }
.screen > .bg { display: block; width: 100%; height: auto; }
.screen .sprite { position: absolute; image-rendering: pixelated; }
.screen .sprite[data-sz="cook"] { width: 64px; height: 64px; }
@media (min-width: 700px) { .screen .sprite[data-sz="cook"] { width: 128px; height: 128px; } }

/* map */
.pin { position: absolute; transform: translate(-50%, -100%); background: none; border: 0; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
.pin .flag { width: 18px; height: 18px; background: var(--ember); box-shadow: 0 0 0 2px var(--parchment-ink); display: grid; place-items: center; font-family: var(--mono); font-size: 16px; color: var(--parchment-ink); line-height: 1; }
.pin .stick { width: 3px; height: 9px; background: var(--parchment-ink); }
.pin .tag { position: absolute; bottom: 100%; margin-bottom: 4px; white-space: nowrap; font-family: var(--display); font-size: 12px; background: var(--parchment); color: var(--parchment-ink); padding: 1px 5px; box-shadow: 0 0 0 2px var(--parchment-ink); }
.pin.locked .flag { background: var(--muted); }
.pin.import .flag { background: var(--saffron); }
.pin.done .flag { background: var(--herb); }
.pin:not(.locked) .flag { animation: bob 1.2s steps(2) infinite; }
@keyframes bob { 50% { transform: translateY(-3px); } }
.panbtn { position: absolute; left: 2%; bottom: 3%; background: none; border: 0; padding: 0; cursor: pointer; }
.panbtn img { width: 64px; height: 64px; display: block; }
.bubble { position: absolute; left: 2%; bottom: calc(3% + 70px); max-width: min(78%, 360px); background: var(--parchment); color: var(--parchment-ink); padding: 8px 10px; font-size: 15px; box-shadow: 0 0 0 3px var(--parchment-ink); }
.bubble b { font-family: var(--display); }

.board { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin: 0 6px 18px; }
.qcard { background: var(--iron-2); box-shadow: var(--px); padding: 12px; display: flex; gap: 10px; align-items: flex-start; }
.qcard img { width: 64px; height: 64px; flex: none; }
.qcard h3 { margin: 0 0 2px; font-family: var(--display); font-size: 17px; }
.qcard .meta { color: var(--muted); font-size: 14px; }
.qcard.locked img { filter: grayscale(1) brightness(.6); }
.hearts { font-family: var(--mono); font-size: 19px; color: var(--ember); letter-spacing: 1px; }
.hearts .off { color: var(--iron-edge); }

/* Dialogue */
.dlg { position: relative; background: var(--parchment); color: var(--parchment-ink); box-shadow: 0 0 0 3px var(--parchment-ink), 0 0 0 6px var(--iron-edge); margin: 26px 6px 18px; padding: 16px 16px 12px; display: flex; gap: 14px; min-height: 120px; }
.dlg .plate { position: absolute; top: -20px; left: 10px; background: var(--ember); color: var(--parchment-ink); font-family: var(--display); font-weight: 600; font-size: 15px; padding: 2px 10px; box-shadow: 0 0 0 3px var(--parchment-ink); }
.dlg .portrait { width: 128px; height: 128px; flex: none; background: var(--iron-2); box-shadow: 0 0 0 3px var(--parchment-ink); }
.dlg .say { flex: 1; min-width: 0; }
.dlg .txt { margin: 0 0 8px; font-size: 18px; min-height: 3em; }
.dlg .txt em { font-style: italic; }
.dlg .btn.sec { background: var(--iron-2); }
.choices { display: grid; gap: 8px; margin-top: 6px; }
.choice { text-align: left; font-family: var(--body); font-size: 16px; background: var(--parchment); color: var(--parchment-ink); border: 0; padding: 9px 12px; cursor: pointer; box-shadow: 0 0 0 2px var(--parchment-ink); }
.choice:hover { background: var(--saffron); }
.choice.wrong { text-decoration: line-through; opacity: .65; }
.hint { font-size: 13px; color: var(--muted); margin: 0 6px 10px; }
.dlg .hint { color: var(--parchment-ink); opacity: .75; margin: 6px 0 0; }

/* Panels */
.panel { background: var(--parchment); color: var(--parchment-ink); box-shadow: 0 0 0 3px var(--parchment-ink), 0 0 0 6px var(--iron-edge); margin: 6px 6px 22px; padding: 16px; }
.panel h2 { font-family: var(--display); font-size: 24px; margin: 0 0 2px; }
.panel h3 { font-family: var(--display); font-size: 18px; margin: 14px 0 6px; }
.panel .sub { font-size: 14px; opacity: .8; margin: 0 0 8px; }
.panel .btn.sec { box-shadow: 0 0 0 3px var(--parchment-ink), 0 4px 0 3px var(--parchment-ink); }
.ironpanel { background: var(--iron-2); box-shadow: var(--px); margin: 6px 6px 22px; padding: 14px; }

/* Gift moment */
.gift { text-align: center; }
.gift .bow { font-family: var(--mono); font-size: 48px; line-height: 1; }
.gift p { max-width: 560px; margin: 8px auto; }

/* Recipe card */
.cardgrid { display: grid; gap: 4px 22px; }
@media (min-width: 760px) { .cardgrid { grid-template-columns: 5fr 7fr; } }
.ings { list-style: none; padding: 0; margin: 0; }
.ings li { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; border-bottom: 2px dotted var(--iron-edge); }
.ings .q { font-family: var(--mono); font-size: 20px; line-height: 1.1; min-width: 70px; }
.ings .nm { flex: 1; }
.ings .why { display: block; font-size: 13px; opacity: .85; }
.ings .swapline { display: block; font-size: 14px; font-weight: 700; }
.st { font-size: 15px; flex: none; }
.steps { padding-left: 22px; margin: 0; }
.steps li { margin-bottom: 8px; }
.ck-i { font-weight: 700; color: var(--parchment-ink); background: color-mix(in srgb, var(--ember) 28%, transparent); padding: 0 2px; }
.ck-c { font-style: italic; }
.ck-t { font-family: var(--mono); font-size: 19px; background: color-mix(in srgb, var(--sky) 30%, transparent); padding: 0 3px; }
.front { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; font-size: 14px; margin: 6px 0 10px; }
.front dt { font-weight: 700; }
.front dd { margin: 0; }
.draft { background: var(--saffron); color: var(--parchment-ink); font-family: var(--display); font-size: 13px; padding: 2px 6px; display: inline-block; box-shadow: 0 0 0 2px var(--parchment-ink); }
pre.cook { background: var(--iron); color: var(--fg); font-family: var(--mono); font-size: 18px; line-height: 1.25; padding: 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; box-shadow: 0 0 0 3px var(--iron-edge); margin: 8px 0; }
pre.cook .k { color: var(--saffron); }
pre.cook .i { color: var(--ember); }
pre.cook .c { color: var(--herb); }
pre.cook .t { color: var(--sky); }
pre.cook .cm { color: var(--muted); }

/* rules strip */
.rules { background: var(--iron-2); color: var(--fg); box-shadow: 0 0 0 3px var(--parchment-ink); padding: 10px 12px; margin: 10px 0 12px; }
.rules .lbl { font-family: var(--display); font-size: 15px; margin-bottom: 6px; display: block; }
.tog { font-family: var(--body); font-size: 14px; background: var(--iron); color: var(--fg); border: 0; padding: 6px 10px; cursor: pointer; box-shadow: 0 0 0 2px var(--iron-edge); margin: 4px; }
.tog[aria-pressed="true"] { background: var(--chili); color: var(--parchment); box-shadow: 0 0 0 2px var(--parchment); }
.tog.diet[aria-pressed="true"] { background: var(--sky); color: var(--parchment-ink); }
.chip { display: inline-block; font-family: var(--display); font-size: 15px; padding: 3px 9px; color: var(--parchment-ink); box-shadow: 0 0 0 2px var(--parchment-ink); }
.chip.ok { background: var(--herb); } .chip.swap { background: var(--saffron); } .chip.blocked { background: var(--chili); color: var(--parchment); } .chip.unverified { background: var(--sky); }
.disclaimer { font-size: 14px; font-weight: 700; border-left: 6px solid var(--chili); padding: 6px 10px; background: color-mix(in srgb, var(--chili) 12%, transparent); margin: 8px 0; }
.footnote { font-size: 13px; opacity: .8; margin: 6px 0; }

/* Bureau slip */
.slip { background: var(--parchment); color: var(--parchment-ink); box-shadow: 0 0 0 2px var(--parchment-ink); padding: 12px 14px; position: relative; overflow: hidden; margin: 10px 0; font-size: 15px; }
.slip .hd { font-family: var(--mono); font-size: 20px; letter-spacing: 1px; border-bottom: 2px solid var(--parchment-ink); margin-bottom: 8px; }
.slip .f { display: grid; grid-template-columns: 110px 1fr; gap: 2px 8px; }
.slip .f dt { font-family: var(--mono); font-size: 17px; }
.slip .f dd { margin: 0; border-bottom: 1px dashed var(--parchment-ink); }
.spell { font-family: var(--mono); font-size: 21px; letter-spacing: 2px; color: var(--chili); }
.stamp { position: absolute; right: 8%; top: 22%; font-family: var(--mono); font-size: 40px; color: var(--chili); border: 4px solid var(--chili); padding: 0 10px; transform: rotate(-14deg) scale(1); opacity: .9; pointer-events: none; animation: stamp .35s steps(4) both; }
@keyframes stamp { 0% { transform: rotate(-14deg) scale(2.4); opacity: 0; } 100% { transform: rotate(-14deg) scale(1); opacity: .9; } }

/* overlay */
.overlay { position: fixed; inset: 0; background: var(--shade); display: grid; place-items: center; padding: 16px; z-index: 20; }
.overlay .slip { width: min(460px, 100%); }

/* Cook mode */
.cm-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; align-items: center; margin: 0 6px 12px; }
.stepno { font-family: var(--mono); font-size: 26px; color: var(--saffron); }
.bigstep { font-size: clamp(22px, 5.2vw, 30px); line-height: 1.35; margin: 4px 0 14px; }
.timerbtn { font-family: var(--mono); font-size: 26px; background: var(--iron); color: var(--fg); border: 0; padding: 6px 14px; cursor: pointer; box-shadow: 0 0 0 3px var(--sky); margin: 4px 6px 4px 0; }
.timerbtn.run { box-shadow: 0 0 0 3px var(--ember); color: var(--ember); }
.timerbtn.done { box-shadow: 0 0 0 3px var(--herb); color: var(--herb); animation: flash .5s steps(2) 6; }
@keyframes flash { 50% { background: var(--herb); color: var(--iron); } }
.checks { list-style: none; padding: 0; margin: 8px 0; }
.checks label { display: flex; gap: 10px; align-items: center; padding: 6px 0; font-size: 18px; cursor: pointer; }
.checks input { width: 24px; height: 24px; accent-color: var(--herb); }
.tray { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 6px 12px; }
.tray .t { font-family: var(--mono); font-size: 18px; padding: 2px 8px; box-shadow: 0 0 0 2px var(--ember); background: var(--iron-2); }
.tray .t.done { box-shadow: 0 0 0 2px var(--herb); color: var(--herb); }
.switch { font-size: 14px; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.panline { display: flex; gap: 10px; align-items: center; margin: 0 6px 16px; }
.panline img { width: 64px; height: 64px; flex: none; }
.panline .b { background: var(--parchment); color: var(--parchment-ink); padding: 8px 12px; box-shadow: 0 0 0 3px var(--parchment-ink); font-size: 16px; }

/* Present */
.photo { max-width: 100%; max-height: 360px; display: block; margin: 10px 0; box-shadow: 0 0 0 3px var(--parchment-ink); image-rendering: auto; }
.filelbl { display: inline-block; }
input[type=file] { font-size: 14px; max-width: 100%; }

/* Rewards */
.cert { text-align: center; position: relative; overflow: hidden; }
.cert .hd { font-family: var(--mono); font-size: 22px; letter-spacing: 2px; }
.rw { list-style: none; padding: 0; margin: 10px auto; max-width: 460px; text-align: left; }
.rw li { padding: 5px 0; border-bottom: 2px dotted var(--iron-edge); font-size: 17px; }
.rw .n { font-family: var(--mono); font-size: 22px; color: var(--chili); }

/* toasts */
.toasts { position: fixed; top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); z-index: 30; display: grid; gap: 8px; justify-items: end; pointer-events: none; }
.toast { font-family: var(--mono); font-size: 22px; background: var(--iron-2); color: var(--saffron); padding: 4px 12px; box-shadow: var(--px); animation: slide .3s steps(4) both; }
@keyframes slide { from { transform: translateX(120%); } to { transform: none; } }

.permit { position: relative; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
footer { color: var(--muted); font-size: 13px; margin: 26px 6px 0; }

@media (max-width: 520px) {
  .dlg { flex-direction: column; align-items: flex-start; }
  .dlg { margin-top: 64px; }
  .dlg .portrait { width: 64px; height: 64px; position: absolute; right: 10px; top: -60px; }
  .dlg .plate { left: 10px; }
  .dlg .txt { font-size: 17px; }
  .pin .tag { font-size: 10px; padding: 0 3px; }
  .panbtn img { width: 64px; height: 64px; }
  .xpbar { width: 70px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="wrap">
  <header class="hud" aria-label="Apprentice status">
    <span class="title">Kitchen Quest</span>
    <span class="lv">Apprentice Lv <span class="num" id="lv">1</span></span>
    <span class="xpbar" title="XP to next level" aria-hidden="true"><i id="xpfill"></i></span>
    <span class="num" id="xpn" aria-label="XP">0 XP</span>
    <span class="num" title="Bureau Stamps">✪ <span id="stamps">0</span></span>
    <span class="badge" id="aibadge">Reactions: scripted</span>
  </header>
  <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  <main id="main"></main>
  <footer>
    Prototype. Recipes are drafts until reviewed by a cook from that tradition. In the real app you'll talk to the Pan out loud; here, tap.
    <br>*The Pantry Bureau regrets any inconvenience caused by the Pantry Bureau.
  </footer>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="sr" aria-live="polite" id="live"></div>

<script>
/* ============================================================
   Recipes as Cooklang (.cook) text — the source of truth.
   ============================================================ */
const RECIPES = {
leela: `---
title: Parippu Curry (Kerala dal with coconut)
country: India
region: Kerala (Kochi)
credit: Home cooks of Kochi, Kerala; taught in-game by Ammachi Leela
cook: ammachi-leela
difficulty: 1
skills: [legumes, heat-control, tempering]
servings: 3
license: CC-BY-SA-4.0
status: draft
---
-- Draft until reviewed by a cook from this tradition.
Rinse @split moong dal{100%g} in a #bowl{} two or three times, until the water runs mostly clear.

Put the dal in a #pot{} with @water{500%ml}, @turmeric{1/4%tsp} and @green chillies{2}, slit lengthways. Simmer, part-covered, until soft enough to crush against the side with a spoon. Add a splash more water if it gets thick. ~{20%minutes}

While it cooks, grind @grated coconut{60%g} with @cumin seeds{1/2%tsp}, @garlic{1%clove} and a splash of water in a #blender{} to a smooth, thick paste.

Mash the dal lightly with the back of a #ladle{}. Stir in the coconut paste and @salt{3/4%tsp}. Bring back to a gentle bubble — no hard boil now, or the coconut splits — and simmer. ~{5%minutes}

For the tempering, heat @coconut oil{1%tbsp} in a #small pan{} over medium heat. Add @mustard seeds{1/2%tsp} and wait until they pop. ~{30%seconds}

Add @shallots{3}, thinly sliced, and @dried red chillies{2}. Fry until the shallots turn golden. ~{3%minutes}

Add @curry leaves{1%sprig} — stand back, they spit — stir for a few seconds, then pour the sizzling tempering over the dal. Serve with hot rice, a spoon of @ghee{1%tsp} if you like, and @pappadam{3}.
`,
marisol: `---
title: Frijoles de Olla
country: Mexico
region: Oaxaca
credit: Home cooks of Oaxaca; taught in-game by Doña Marisol
cook: dona-marisol
difficulty: 1
skills: [legumes, heat-control, patience]
servings: 6
license: CC-BY-SA-4.0
status: draft
---
-- Draft until reviewed by a cook from this tradition. No soaking needed; older beans just take longer.
Spread @dried black beans{500%g} on a #tray{} and pick out any small stones or shrivelled beans. Rinse them well in a #colander{}.

Put the beans in an #olla{} or other heavy pot with @water{2.5%l}, @white onion{1/2}, @garlic{2%cloves} and @lard{1%tbsp}. Bring to a boil. ~{10%minutes}

Turn the heat down to the gentlest simmer and partly cover. Cook until the beans are soft and creamy inside. Check now and then: if the water dips below the beans, add hot water from a #kettle{}, never cold. ~{2%hours}

Taste a few beans. When they are completely tender, add @salt{2%tsp} and @epazote{2%sprigs}. Simmer so the broth takes the flavour. ~{20%minutes}

Fish out the onion and the epazote stalks. Taste the broth and adjust the salt. Serve the beans in their broth in a #bowl{}, with warm @corn tortillas{6} on the side.
`,
haruka: `---
title: Onigiri (rice balls)
country: Japan
region: Osaka (Kansai)
credit: Home cooks and onigiri shops of Osaka; taught in-game by Haruka
cook: haruka
difficulty: 2
skills: [grains, heat-control, shaping]
servings: 6
license: CC-BY-SA-4.0
status: draft
---
-- Draft until reviewed by a cook from this tradition. 360 ml rice = 2 rice-cooker cups (about 300 g).
Measure @Japanese short-grain rice{360%ml} into a #bowl{}. Add cold water, swirl gently with your fingertips and pour it off quickly. Repeat three or four times, until the water is only slightly cloudy. Drain in a #sieve{}.

Put the rice in a #heavy pot with a lid{} with @water{400%ml} and let it soak. ~{30%minutes}

Bring to a boil over medium-high heat with the lid on, then turn the heat to its lowest and cook without lifting the lid. ~{13%minutes}

Turn off the heat and let the rice steam, lid still on. ~{10%minutes}

Meanwhile, make okaka: mix @katsuobushi{5%g} (bonito flakes) with @soy sauce{1%tsp}. Pit @umeboshi{2} and tear them into pieces.

Fluff the rice with a wet #rice paddle{} and let it cool until you can hold it comfortably — warm, not hot. ~{5%minutes}

Wet your hands and rub a pinch of @salt{1%tsp} over your palms. Take about 100 g of rice, press a dent in the middle, add a little filling, and close the rice over it.

Cup one hand into a V and turn the ball into a triangle with three or four gentle presses — firm enough to hold, never squashed. Wrap each in a strip of @nori{2%sheets}, cut in thirds, just before eating.
`,
import: `---
title: Pasta al Limone
country: Italy
region: Campania (Amalfi Coast)
credit: From an Instagram post you imported; original author credited in your private copy
source: instagram
license: author's own — private, not in the open canon
status: private-import
---
Cook @spaghetti{200%g} in a #large pot{} of well-salted boiling water until al dente. ~{9%minutes}

Meanwhile, in a #wide pan{}, melt @butter{30%g} over low heat with the zest of @lemon{1}.

/* ============================================================
   Tiny Cooklang parser (front matter + @ingredients, #cookware, ~timers)
   ============================================================ */
const TOKEN = /@([^@#~{}\n]+?)\{([^}]*)\}|@([\p{L}\d_-]+)|#([^@#~{}\n]+?)\{([^}]*)\}|#([\p{L}\d_-]+)|~([^@#~{}\n]*?)\{([^}]*)\}/gu;
function splitQty(s) { const [q = "", u = ""] = (s || "").split("%"); return { qty: q.trim(), unit: u.trim() }; }
function parseCook(src) {
  const meta = {}; let body = src;
  const fm = src.match(/^---\n([\s\S]*?)\n---\n?/);
  if (fm) {
    body = src.slice(fm[0].length);
    for (const line of fm[1].split("\n")) {
      const m = line.match(/^(\w+):\s*(.*)$/); if (!m) continue;
      let v = m[2].trim();
      if (/^\[.*\]$/.test(v)) v = v.slice(1, -1).split(",").map(x => x.trim()).filter(Boolean);
      meta[m[1]] = v;
    }
  }
  const notes = [];
  const paras = body.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
  const steps = []; const ingredients = []; const cookware = [];
  for (const para of paras) {
    const lines = [];
    for (const ln of para.split("\n")) {
      const c = ln.indexOf("--");
      if (c === 0) { notes.push(ln.slice(2).trim()); continue; }
      lines.push(ln);
    }
    const text = lines.join(" ").trim(); if (!text) continue;
    const parts = []; let last = 0; let m;
    TOKEN.lastIndex = 0;
    while ((m = TOKEN.exec(text))) {
      if (m.index > last) parts.push({ type: "text", value: text.slice(last, m.index) });
      if (m[1] !== undefined || m[3] !== undefined) {
        const name = (m[1] ?? m[3]).trim(); const { qty, unit } = splitQty(m[2]);
        const ing = { type: "ingredient", name, qty, unit };
        parts.push(ing); ingredients.push(ing);
      } else if (m[4] !== undefined || m[6] !== undefined) {
        const name = (m[4] ?? m[6]).trim(); parts.push({ type: "cookware", name }); if (!cookware.includes(name)) cookware.push(name);
      } else {
        const { qty, unit } = splitQty(m[8]);
        parts.push({ type: "timer", name: (m[7] || "").trim(), qty, unit, seconds: toSeconds(qty, unit) });
      }
      last = TOKEN.lastIndex;
    }
    if (last < text.length) parts.push({ type: "text", value: text.slice(last) });
    steps.push(parts);
  }
  // unique ingredient list in order of appearance
  const list = [];
  for (const i of ingredients) {
    const ex = list.find(x => x.name.toLowerCase() === i.name.toLowerCase());
    if (ex) { if (i.qty) ex.amounts.push(fmtQty(i)); } else list.push({ name: i.name, amounts: i.qty ? [fmtQty(i)] : [] });
  }
  return { meta, notes, steps, ingredients: list, cookware };
}
function toSeconds(q, u) {
  const n = parseFrac(q); u = (u || "").toLowerCase();
  if (/^h/.test(u)) return n * 3600; if (/^m/.test(u)) return n * 60; return n;
}
function parseFrac(q) { if (!q) return 0; if (q.includes("/")) { const [a, b] = q.split("/").map(Number); return a / b; } return Number(q) || 0; }
function fmtQty(i) { return [i.qty, i.unit].filter(Boolean).join(" "); }
function highlightCook(src) {
  const esc = escapeHtml(src);
  return esc.replace(/^(---[\s\S]*?---)/, m => m.replace(/^(\w+):/gm, '<span class="k">$1</span>:'))
    .replace(/^(--.*)$/gm, '<span class="cm">$1</span>')
    .replace(/(@[^@#~{}\n]+?\{[^}]*\})/g, '<span class="i">$1</span>')
    .replace(/(#[^@#~{}\n;&]+?\{[^}]*\})/g, '<span class="c">$1</span>')
    .replace(/(~\{[^}]*\})/g, '<span class="t">$1</span>');
}

function reach(id, seen = new Set(), path = []) {
  // returns array of {node, path:[...]} for every ancestor via is_a / contains
  const out = []; const g = GRAPH[id]; if (!g) return out;
  for (const rel of ["is_a", "contains"]) for (const n of (g[rel] || [])) {
    if (seen.has(n)) continue; seen.add(n);
    const p = [...path, `${rel === "is_a" ? "is a" : "contains"} ${n.replace(/_/g, " ")}`];
    out.push({ node: n, path: p }, ...reach(n, seen, p));

  return hit ? hit.path : null;
}
function checkIngredient(name, active) {
  const id = ALIAS[name.toLowerCase()];
  if (!id || !GRAPH[id]) return { status: "unverified", why: "Store-bought or unknown: can't verify the ingredients. Check the label." };
  const hits = [];
  for (const k of active) { const p = matches(id, RULES[k]); if (p) hits.push({ rule: k, path: p }); }
  if (!hits.length) return { status: "ok" };
  const sub = (SUBS[id] || []).find(s => active.every(k => !matches(s.id, RULES[k])));
  const why = hits.map(h => `${RULES[h.rule].label}: ${name} → ${h.path.join(" → ")}`).join("; ");
  return sub ? { status: "swap", why, sub } : { status: "blocked", why };
}

  const findings = parsed.ingredients.map(i => ({ ...i, ...checkIngredient(i.name, active) }));

  const status = has("blocked") ? "blocked" : has("unverified") ? "unverified" : has("swap") ? "swap" : "ok";

}

/* ============================================================
   4. Cook mode
   ============================================================ */
let timers = {}; let tick = null; let fast = false; let wake = null;
function stopAll() { if (tick) { clearInterval(tick); tick = null; } timers = {}; if (wake) { try { wake.release(); } catch {} wake = null; } }
function fmt(s) { s = Math.max(0, Math.ceil(s)); const m = Math.floor(s / 60), ss = s % 60; return String(m).padStart(2, "0") + ":" + String(ss).padStart(2, "0"); }
let checked = {};
function renderCookMode() {
  const k = view.cook, c = COOKS[k], P = parseCook(RECIPES[k]);
  const n = view.step || 0, parts = P.steps[n], total = P.steps.length;
  const res = checkRecipe(P, S.rules);
  const subOf = name => res.findings.find(f => f.name === name && f.status === "swap");
  const stepIngs = parts.filter(p => p.type === "ingredient");
  const stepTimers = parts.map((p, i) => ({ ...p, key: `${n}-${i}` })).filter(p => p.type === "timer");
  const body = parts.map((p, i) => {
    if (p.type === "text") return escapeHtml(p.value);
    if (p.type === "ingredient") { const s = subOf(p.name); return `<span class="ck-i">${s ? escapeHtml(s.sub.label.split(" —")[0].split(",")[0]) + " (swapped)" : escapeHtml(p.name)}</span>`; }
    if (p.type === "cookware") return `<span class="ck-c">${escapeHtml(p.name)}</span>`;
    return `<span class="ck-t">${escapeHtml(p.qty)} ${escapeHtml(p.unit)}</span>`;
  }).join("");
  main.innerHTML = `
  <div class="cm-top">
    <span class="stepno">STEP ${n + 1}/${total}</span>
    <span class="row">
      <label class="switch"><input type="checkbox" id="fast" ${fast ? "checked" : ""}> Demo: fast-forward ×60</label>
      <button class="btn sec small" id="wake" aria-pressed="${!!wake}">${wake ? "☀ Screen kept awake" : "☀ Keep screen awake"}</button>
    </span>
  </div>
  <div class="tray" id="tray" aria-label="Running timers"></div>
  <section class="panel" aria-label="Current step">
    <p class="bigstep">${body}</p>
    ${stepTimers.length ? `<div>${stepTimers.map(t => `<button class="timerbtn" data-t="${t.key}" data-s="${t.seconds}" aria-label="Start ${t.qty} ${t.unit} timer">⏲ ${fmt(t.seconds)}</button>`).join("")}</div>` : ""}
    ${stepIngs.length ? `<h3>Check off</h3><ul class="checks">${stepIngs.map((p, i) => { const id = `${k}-${n}-${i}`; const s = subOf(p.name);
      return `<li><label><input type="checkbox" data-ck="${id}" ${checked[id] ? "checked" : ""}> ${escapeHtml(s ? s.sub.label : p.name)}${p.qty ? ` — <span style="font-family:var(--mono);font-size:21px">${escapeHtml(fmtQty(p))}</span>` : ""}</label></li>`; }).join("")}</ul>` : ""}
    <div class="row">
      <button class="btn sec" id="prev" ${n === 0 ? "disabled" : ""}>◀ Previous</button>
      <button class="btn" id="next">${n === total - 1 ? "Done — present your dish ▶" : "Next step ▶"}</button>
    </div>
  </section>
  <div class="panline"><img src="art/pan.png" alt="The Pan"><div class="b" id="panq">${n === 0 ? "Big text, one step at a time. Tap a timer to start it. I'll keep count; I have nothing else on." : escapeHtml(pick(PAN_COOK))}</div></div>
  <p class="hint">${c.dish} · taught by ${c.name}. Timers keep running when you change steps.</p>`;
  $("#fast").onchange = e => { fast = e.target.checked; };
  $("#wake").onclick = toggleWake;
  main.querySelectorAll("[data-ck]").forEach(b => b.onchange = () => { checked[b.dataset.ck] = b.checked; });
  main.querySelectorAll("[data-t]").forEach(b => b.onclick = () => {
    const key = b.dataset.t, t = timers[key];
    if (!t) timers[key] = { left: +b.dataset.s, run: true, label: b.getAttribute("aria-label").replace("Start ", "") };
    else if (t.left <= 0) { t.left = +b.dataset.s; t.run = true; }
    else t.run = !t.run;
    startTick(); paintTimers();
  });
  $("#prev").onclick = () => { view.step = n - 1; renderKeep(); };
  $("#next").onclick = () => {
    if (n === total - 1) { gain(10, "Cooking"); return go({ name: "present", cook: k }); }
    view.step = n + 1; renderKeep();
  };
  paintTimers();
}
function renderKeep() { crumbs(); renderCookMode(); window.scrollTo({ top: 0 }); }
function startTick() {
  if (tick) return;
  let last = Date.now();
  tick = setInterval(() => {
    const now = Date.now(), dt = (now - last) / 1000 * (fast ? 60 : 1); last = now;
    for (const t of Object.values(timers)) if (t.run && t.left > 0) { t.left -= dt; if (t.left <= 0) { t.left = 0; t.run = false; t.justDone = true; } }
    paintTimers();
  }, 250);
}
function paintTimers() {
  const tray = $("#tray"); if (!tray) return;
  for (const [key, t] of Object.entries(timers)) {
    const b = main.querySelector(`[data-t="${key}"]`);
    if (b) { b.textContent = (t.left <= 0 ? "✓ " : t.run ? "⏸ " : "▶ ") + fmt(t.left); b.className = "timerbtn " + (t.left <= 0 ? "done" : t.run ? "run" : ""); }
    if (t.justDone) { t.justDone = false; beep(); const q = $("#panq"); if (q) q.textContent = `Timer done (${t.label}). I didn't blink. I can't blink.`; say(`Timer done: ${t.label}`); }
  }
  tray.innerHTML = Object.values(timers).map(t => `<span class="t ${t.left <= 0 ? "done" : ""}">⏲ ${escapeHtml(t.label)} ${fmt(t.left)}</span>`).join("");
}
function beep() { try { const a = new (window.AudioContext || window.webkitAudioContext)(); const o = a.createOscillator(); o.type = "square"; o.frequency.value = 880; o.connect(a.destination); o.start(); o.stop(a.currentTime + 0.25); } catch {} }
async function toggleWake() {
  const q = $("#panq");
  if (wake) { try { await wake.release(); } catch {} wake = null; renderKeep(); return; }
  try { wake = await navigator.wakeLock.request("screen"); wake.addEventListener?.("release", () => { wake = null; }); renderKeep(); q && ($("#panq").textContent = "Screen will stay awake. So will I. I always am."); }
  catch { if (q) q.textContent = "Your browser declined to keep the screen awake. Tap it now and then with a clean knuckle; I'll nag."; }
}

    <div id="prev"></div>
    <div class="row">
      <button class="btn" id="showcook" disabled>Show ${c.name} ▶</button>
      <button class="btn sec" id="skip">Skip photo (I cooked it, honest)</button>
    </div>
    <p class="footnote">${sample ? (imagesOK ? "Live AI reaction (Claude standing in for the production model)." : "Live AI is on, but images aren't available here — you'll get a scripted reaction.") : "Scripted reactions (no live AI on this page right now)."}</p>
  </section>
  <div id="react"></div>`;
  $("#photo").onchange = e => {
    photoFile = e.target.files?.[0] || null;
    if (photoUrl) URL.revokeObjectURL(photoUrl);
    photoUrl = photoFile ? URL.createObjectURL(photoFile) : null;
    $("#prev").innerHTML = photoUrl ? `<img class="photo" src="${photoUrl}" alt="Your photo of ${c.dish}">` : "";
    $("#showcook").disabled = !photoFile;
  };
  $("#showcook").onclick = () => react(k, true);
  $("#skip").onclick = () => react(k, false);
}
async function react(k, withPhoto) {
  const c = COOKS[k];
  $("#react").innerHTML = dialogueBox(k);
  const txt = $("#dtxt"), act = $("#dact");
  const done = () => { act.innerHTML = `<button class="btn" id="torw">Collect rewards ▶</button>`; $("#torw").onclick = () => go({ name: "rewards", cook: k, photo: withPhoto }); $("#torw").focus(); };
  $(".dlg").addEventListener("click", e => { if (e.target.tagName !== "BUTTON") skipTyping(); });
  $(".dlg").scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "center" });
  if (!withPhoto) { typeInto(txt, `No photo? I believe you. ${k === "leela" ? "Your sleeves smell of mustard seeds and coconut oil" : k === "marisol" ? "You have the calm face of someone who waited two hours for beans" : "There is a grain of rice on your elbow"}. That's evidence enough.`, done); return; }
  if (!sample || !imagesOK) { typeInto(txt, pick(c.scripted), done); return; }
  txt.textContent = `${c.name} is looking at your photo…`;
  ctl = new AbortController();
  act.innerHTML = `<button class="btn sec small" id="stop">Stop</button>`;
  $("#stop").onclick = () => ctl.abort();
  const P = parseCook(RECIPES[k]);
  const prompt = `You are ${c.name}, a home cook from ${c.place}, in a cozy cooking game. Your apprentice — a guest you have been teaching — just cooked your ${c.dish} for real and is showing you a photo. Ingredients: ${P.ingredients.map(i => i.name).join(", ")}.
React in character in 2 to 4 sentences of plain English: warm and dry, competent, a little funny. Name one specific thing you can actually see in the photo. Give exactly one practical tip for next time. This is a reaction, not a grade or a verification.
Never comment on bodies, weight, health or diet. Never joke about cultures or accents. If the photo doesn't show food, say so kindly and with humour. No preamble, no emoji, no quotation marks.`;
  let got = false;
  try {
    const { text } = await sample(prompt, { images: [photoFile], modelTier: "quick", signal: ctl.signal,
      onText: ({ text }) => { got = true; txt.textContent = text; } });
    txt.textContent = (text || "").trim() || pick(c.scripted);
    done();
  } catch (e) {
    if (e?.code === "cancelled" || e?.name === "AbortError") { txt.textContent = got ? txt.textContent : "…" + c.name + " smiles and waits."; return done(); }
    if (e?.code === "rate_limited") { txt.textContent = `${c.name} needs a moment — the shop is busy. Here's what she said earlier:`; typeInto(txt, pick(c.scripted), done); return; }
    if (["not_granted", "sampling_disabled", "tools_unavailable"].includes(e?.code)) { sample = null; updateAiBadge(); }
    typeInto(txt, pick(c.scripted), done);
  }
}

/* ============================================================
   6. Rewards + introduction
   ============================================================ */
function renderRewards() {
  const k = view.cook, c = COOKS[k], P = parseCook(RECIPES[k]);
  const first = !S.cooked[k];
  const xp = first ? 50 : 25, sxp = 15;
  const nxt = c.next && COOKS[c.next];
  const intro = first && nxt && !S.unlocked[c.next];
  S.cooked[k] = (S.cooked[k] || 0) + 1;
  S.trust[k] = Math.min(4, S.trust[k] + 1);
  S.stamps += 3;
  const meal = `${c.dishShort} · 1 serving`;
  S.log.push({ meal, at: Date.now() });
  if (intro) S.unlocked[c.next] = true;
  save();
  gain(xp, "Cook day");
  const skills = P.meta.skills.map(s => SKILL_NAMES[s] || s);
  skills.forEach((s, i) => setTimeout(() => gain(sxp, s), 350 * (i + 1)));
  main.innerHTML = `
  <section class="panel cert" aria-label="Bureau certificate">
    <div class="hd">PANTRY BUREAU · CERTIFICATE OF A DISH COOKED</div>
    <p class="footnote">Form 51-D (in triplicate; the other two copies are with the Pan)</p>
    <img src="${c.sprite}" alt="" width="128" height="128">
    <h2>${c.dish}</h2>
    <p class="sub">Taught by ${c.name}, on behalf of the home cooks of ${c.short}.</p>
    <ul class="rw">
      <li><span class="n">+${xp} XP</span> · Cook day${first ? " (first time)" : ""}</li>
      ${skills.map(s => `<li><span class="n">+${sxp}</span> · ${s} skill</li>`).join("")}
      <li>Trust with ${c.name}: ${hearts(S.trust[k])} ${TRUST[S.trust[k]]}</li>
      <li><span class="n">+3 ✪</span> · Bureau Stamps</li>
      <li>📒 Logged: ${escapeHtml(meal)}</li>
    </ul>
    <p class="footnote">*Certificate confers no rights, titles or kitchens. It does confer the right to make this again.</p>
    <div class="stamp" style="top:auto;bottom:16px;right:16px;font-size:32px">APPROVED</div>
  </section>
  ${intro ? `${dialogueBox(k)}
  <section class="panel gift" aria-label="Introduction"><div class="bow" aria-hidden="true">✉</div>
    <h2>An introduction: ${nxt.name}</h2><p>${nxt.place} is now open on your map.</p>
    <img src="${nxt.sprite}" alt="${nxt.name}" width="64" height="64"></section>`
  : (c.next ? "" : dialogueBox(k))}
  <div class="row" style="margin:0 6px"><button class="btn" id="tomap">Back to the map ▶</button></div>`;
  if (intro || !c.next) { typeInto($("#dtxt"), c.intro); $(".dlg").addEventListener("click", () => skipTyping()); }
  $("#tomap").onclick = () => go({ name: "map" });
  if (intro) setTimeout(() => toast(`🗺 ${nxt.short} unlocked`), 1600);
  // rewards are granted once per visit to this screen; replace history so back doesn't re-grant
  view = { name: "rewards-done", cook: k };
}

/* boot */
render();
</script>
