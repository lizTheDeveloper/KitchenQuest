faq:
  - q: ["how long do spices last", "do spices expire", "are old spices safe"]
    a: "Dry spices rarely become unsafe; they fade. Ground spices lose their best within months to a year or two; whole ones last a few years. If a jar smells of nothing, it will taste of nothing. If it's damp, clumped with moisture or mouldy, throw it out."
  - q: ["how do i grind spices without a grinder", "no spice grinder", "grind spices"]
    a: "A mortar and pestle, a heavy pan pressed over seeds on a board, or a rolling pin over seeds in a sealed bag. A cheap electric coffee grinder kept only for spices is the merchant's secret weapon. Not very secret now."
  - q: ["how do i toast spices", "toast whole spices", "dry roast spices"]
    a: "Dry pan, medium heat, keep them moving. Thirty to sixty seconds for small seeds, until fragrant and a shade darker. Tip them onto a plate straight away so they stop cooking."
  - q: ["what is blooming spices", "what is tempering", "tadka", "bloom spices in oil"]
    a: "Frying spices in hot oil or ghee so their flavours move into the fat, which then carries them through the whole dish. Whole seeds first, until they pop or sizzle; ground spices last, for seconds. Ammachi Leela's parippu ends with exactly this."
  - q: ["what is garam masala", "garam masala vs curry powder"]
    a: "Garam masala is a warm spice blend used in many Indian kitchens; its recipe changes from region to region and family to family. 'Curry powder' is a blend that grew up mostly outside India. Neither is one fixed thing. Smell the bag; use what tastes right."
    # REVIEW: confirm phrasing on curry powder's history is fair and not reductive.
  - q: ["spice blend allergens", "hidden allergens in spices", "are spice blends safe for allergies"]
    a: "Blends can hide things. Asafoetida usually has wheat flour; some blends contain mustard, celery, sesame or nut flours. Labelling rules differ by country, and some don't require every spice to be named. If you have an allergy, choose single spices and check every label."
    tags: [safety]
    # REVIEW: country-specific labelling (US: major allergens incl. sesame must be declared, mustard/celery not; EU/UK: mustard, celery, sesame are declared allergens; Canada: mustard and sesame). Keep the line general unless region-aware.
  - q: ["how do i get turmeric stains out", "turmeric stain"]
    a: "Quickly, and with a little dish soap, then sunlight — sun fades turmeric stains on cloth and countertops remarkably well. Your fingers will forgive you in a day or two."
  - q: ["whole or ground spices", "should i buy whole spices"]
    a: "Whole for the ones you toast or temper with (cumin, mustard, coriander, fennel, pepper). Ground for things you use in pinches and replace often (turmeric, paprika, chilli). Always small bags."
