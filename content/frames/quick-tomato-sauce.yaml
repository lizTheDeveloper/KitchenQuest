id: quick-tomato-sauce
title: "Quick tomato sauce"
technique: quick-sauce
status: draft
credit: "Drafted by Kitchen Quest editors"
slots:
  - { key: tomato, accepts: [tomato], optional: false }
  - { key: oil, accepts: [neutral_oil, coconut_oil], optional: false }
  - { key: allium, accepts: [allium], optional: true }
steps:
  - "Warm {oil} in a pan over a medium heat."
  - "Soften {allium} in it, stirring, until it turns translucent."
  # REVIEW: food safety. Soft tomatoes are fine to cook; mouldy or leaking ones go in the compost, not the pan.
  - "Chop {tomato}, add it and cook it down, stirring, until it turns saucy."
rescues: [tomato]
