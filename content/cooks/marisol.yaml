# Doña Marisol: home cook, Oaxaca, Mexico. Dish: frijoles de olla (pot beans, black beans with epazote).
# Voice: docs/style/voice.md §4. Competent, specific, warm. Never the joke.
# Recipe: recipes/mexico/oaxaca/frijoles-de-olla.cook (status: draft until reviewed by a cook from Oaxaca).
# Address the apprentice as "corazón" or by name. Not "mijo/mija" unless pronouns are set.
# (The prototype used "mijo" once; changed here for neutrality.)

id: marisol
name: "Doña Marisol"
place: "Oaxaca, Mexico"
dish: "Frijoles de olla"
recipe: mexico/oaxaca/frijoles-de-olla

persona:
  - "A home cook in Oaxaca with a yard full of epazote and a clay olla older than most of her neighbours. Learned beans from her abuela, who learned them from hers."
  - "Patient, wry, and unhurried; beans have taught her that most problems are solved by waiting and adding hot water. Says 'the beans will forgive you. Mostly.'"
  - "Generous host: you will be fed, and you will take some home. Precise about the few things that matter: salt at the end, hot water never cold, the gentlest simmer."
  - "Proud of Oaxaca's food and its many communities, and credits them; never treats her cooking as a secret or a performance. Practical about cooking abroad with whatever pot and beans you can find."
  - "Addresses the apprentice as 'corazón'. Uses Spanish naturally and explains it. Writes letters to Leela in Kochi (they argue about which beans keep best) and to Haruka in Osaka."

intro:
  - "Pásale, pásale. Leela said you were coming. She also said you're slow with the shallots."
  - "Come in, sit, have some coffee. There are beans on already. There are always beans on already."
  - "I'm Marisol. Doña Marisol to the Bureau, Marisol to you, 'Abuela' to half the children on this street, and not all of them are mine."
  - "Your pan can sit by the comal. It'll feel at home. Everything near the comal feels at home."
  - "Did Leela send mustard seeds? She did. Ay, that woman. Put them on the shelf. No, the other shelf. The one where I keep things I'm pretending not to want."

story:
  - "Frijoles de olla — beans from the pot. Here we cook black beans in an olla de barro, a clay pot, with a little lard and epazote from the yard. Nothing else is needed. Time is the main ingredient, and it's free."
  # REVIEW: The common bean was domesticated in Mesoamerica several thousand years ago (often cited ~7,000-8,000 years). Confirm phrasing; keep it vague if unsure.
  - "Beans have been cooked in this part of the world for thousands of years, alongside corn and squash in the milpa. The people who first grew them are still here — in Oaxaca there are many Indigenous peoples, many languages — and they're still cooking beans. So am I."
  # REVIEW: Oaxaca recognises around 16 Indigenous peoples (Zapotec, Mixtec, Mazatec, Mixe, Chinantec and others). Check whether Marisol should name her own community or keep it general; a reviewer from Oaxaca should decide.
  - "My grandmother said the olla gives a taste you cannot buy. Use whatever heavy pot you have. The beans will forgive you. Mostly."
  # REVIEW: Toasted avocado leaves (hoja de aguacate, from the Mexican avocado) are a characteristic Oaxacan seasoning for black beans. Confirm, and confirm Marisol would mention them as optional.
  - "Some days I toast an avocado leaf on the comal and put it in. Some days hierba de conejo. Most days just epazote. Every family in Oaxaca has an opinion about this, and every opinion is right in its own kitchen."
  - "A pot of beans on Monday is lunch on Tuesday, refritos on Wednesday, enfrijoladas on Thursday. By Friday you are a richer person, and the beans have only cost you a little money and a lot of patience."

quest:
  id: marisol-salt-question
  cook: marisol
  title: "The Salt Question"
  unlock: { requires: [leela-tempering], trust: 0 }
  steps:
    - type: talk
      lines:
        - "Before we cook, we sort. Spread the beans on a tray and look. Little stones, broken beans, the shrivelled ones — out. Beans come from fields, and fields have opinions."
        - "First, a question my neighbour's son got wrong for three years. Let's see about you."

    - type: riddle
      prompt: "When do you add the salt to a pot of beans?"
      options:
        - text: "At the end, once the beans are completely soft"
          correct: true
          reaction: "Exactly. Some say early salt toughens the skins — my abuela did, the scientists argue. But this I know for sure: the broth cooks down for hours. Salt at the start, and you've salted twice."
        - text: "At the very start, all of it"
          correct: false
          reaction: "And then two hours later the broth has cooked down and it tastes like the sea. You can always add salt. You cannot un-add it."
        - text: "Never — beans are naturally salty"
          correct: false
          reaction: "Beans are many things, corazón. Salty is not one of them. Try again."
        - text: "Whenever the beans look like they want it"
          correct: false
          reaction: "Beans don't ask. They wait. Like a good guest. Think about the broth — what happens to it over two hours?"
      # REVIEW: Food-science sources (e.g. Serious Eats, America's Test Kitchen) report early salting doesn't toughen beans and can soften skins. The riddle's "right" answer is about the broth reducing, which is true either way; Marisol's line already acknowledges the argument.
      explain: "The broth reduces over a long simmer, so salt added at the start concentrates; salting once the beans are soft lets you season the finished broth exactly."

    - type: errand
      stall: okafor-sato
      item: black_bean
      lines:
        - "I want you to see how to buy beans when you're far from here. Go to Okafor-Sato and bring me a bag of dried black beans."
        - "Look for beans that are glossy and the same size, with few broken ones. Buy from a shop that sells a lot of them; old beans can take forever to soften, and some never do."
        - "Good. These are young — well, young for a dried bean. Okafor-Sato chose well, or you did. Probably both."

    - type: drill
      skill: heat-control
      prompt: "Bring the pot to a boil, then turn it down to the gentlest simmer: small bubbles lazily breaking the surface now and then, not a rolling boil. Keep it partly covered."
      lines:
        - "Look at the pot. If it's jumping, it's too hot; the beans will knock into each other and split, and the broth will cloud and run away."
        - "A few slow bubbles. Like the pot is thinking. That's the speed of good beans."
        - "When the water dips below the beans, add hot water from the kettle. Never cold. Cold stops everything and the beans take offence."
        - "Now we wait. In this house, waiting is a skill. You'll get points for it from the Bureau. You'll get beans from me, which are better."

    # M5: recognition of a technique learned in another cook's kitchen (audit M-3). Empty in M5: the game speaks
    # the Pan's generic quest.recognize line when the technique is known, and nothing otherwise. The cook's own
    # lines need a reviewer from this cuisine and wait for M10.
    - type: recognize
      technique: tempering
      lines: []
      otherwise: []

    - type: cook
      recipe: mexico/oaxaca/frijoles-de-olla

  rewards: { xp: 45, trust: 1, skills: { legumes: 10, heat-control: 10, patience: 10 } }

gift:
  - "Good. Now I'll teach you the pot. Bring hot water when it runs low, never cold — cold stops everything and the beans take offence."
  - "Sort, rinse, cover them well with water. A piece of onion, a clove or two of garlic, a spoon of lard. Boil, then the smallest simmer, lid half on, for as long as they need. Usually two hours. Sometimes more. The beans decide."
  - "When you can squash one easily against the roof of your mouth, it's time for salt and epazote. Twenty minutes more, so the broth drinks them in."
  - "This is my abuela's way, and her mother's, and half of Oaxaca's. Now you have it too. Cook a big pot. Feed someone. That's the whole recipe."

