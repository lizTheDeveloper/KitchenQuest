reactions:
  photo:
    - "From here it looks like a proper pot of beans — and a pot of beans is a kind of patience you can eat. Tip: mash a spoonful against the side and stir it back; the broth gets silkier."
    - "You waited two hours for beans. In this house that makes you family, or at least a cousin. Next time try a little crumbled queso fresco on top."
    - "The broth looks dark and glossy. That's the beans giving up their colour, which is what you want. If it looks thin, simmer it uncovered for ten minutes before you salt the last time."
    - "The beans look whole, not burst. Good — that means the simmer was gentle. Rolling boils split the skins."
    - "Beautiful. Eat them in a bowl with the broth and a warm tortilla. Tomorrow, fry the leftovers in a little oil and mash them; refritos are the beans' second career."
    - "I see onion still floating there. Fish it out before serving — it has given everything it had. Then squeeze a little lime over your bowl if you like."
    - "That pot will feed you for days. Keep the beans in their broth in the fridge; the broth keeps them soft and is the best part."
    - "They look creamy. When the beans are this soft, spoon some broth with a few beans over rice, with chopped onion and chile on top. Simple and very good."
  skip_photo:
    - "No photo? That's fine. Beans aren't very photogenic anyway. They're beautiful on the inside."
    - "You don't have to show me. Did you wait for them to be soft? Then they're good."
    - "Eat. Pictures are for the Bureau. Beans are for you."

introduction:
  - "Haruka in Osaka and I write each other letters about rice and beans, which are the two halves of half the world's dinners. I've told her about you."
  - "She runs an onigiri shop. Small, very clean, very early. She is younger than me and stricter than me, which I respect."
  - "Be on time; she opens at six. And bring her something. Not beans. She has beans. Bring her a good story about beans instead."

faq:
  - q: ["can i use canned beans", "canned beans ok", "tinned beans", "canned black beans"]
    a: "For a quick lunch, yes: drain and rinse two cans, warm them gently with a little onion, garlic and a sprig of epazote in fresh water or stock for fifteen minutes. But it won't be frijoles de olla. The olla is about the broth, and the broth comes from the beans cooking slowly from dry. Canned saves time; dried saves money and gives you the broth."
    tags: [substitution]
  - q: ["do i need to soak the beans", "soak black beans", "should i soak", "overnight soak"]
    a: "In this house, no. Black beans cook fine from dry; they just take a bit longer. If you like, soak them overnight and they'll be done sooner and a bit more evenly. Either way, throw out any that float, and keep the hot kettle ready."
    tags: [technique]
  - q: ["what if i don't have epazote", "epazote substitute", "where to buy epazote", "no epazote"]
    a: "Mexican grocers sell it, fresh or dried. Dried works: about a teaspoon instead of two sprigs. If you can't find it, leave it out — the beans will still be good, just not quite Oaxacan. Some people use a little Mexican oregano instead; it's different, but it's not wrong in your kitchen."
    tags: [substitution]
  # REVIEW: Mexican oregano as an epazote stand-in is common advice in English-language recipes; confirm Marisol would say it.
  - q: ["what is epazote", "what does epazote taste like"]
    a: "An herb that grows like a weed — in my yard, it is a weed. Strong, a little like oregano and mint and something of its own. We put it in beans, in quesadillas, in soups. Use it in small amounts; it's bossy."
  - q: ["can i use oil instead of lard", "vegetarian beans", "no lard", "vegan frijoles"]
    a: "Yes. A spoon of neutral oil, or leave the fat out. The lard gives a little richness; the beans don't need it to be good. Without it, the whole pot is vegan."
    a_if_blocked: "Use a spoon of neutral oil instead, or no fat at all. The beans will still be rich and good, and this version has been checked against your rules."
    tags: [substitution]
  - q: ["my beans are still hard", "beans won't soften", "beans taking forever", "why are my beans still hard"]
    a: "Usually old beans — they dry out more each year on the shelf. Hard water slows them too, and so does cooking high up; here in Oaxaca City we're about one and a half kilometres up, so water boils cooler and beans take longer. Keep simmering, keep adding hot water. Next time buy from a busy shop, and a pinch of baking soda in the pot can help with hard water."
    tags: [technique]
  # REVIEW: Oaxaca City elevation ~1,550 m; check. Baking soda softens beans in hard water (alkaline breaks down pectin) — accurate, but too much tastes soapy; a pinch only.
  - q: ["can i use a slow cooker", "crockpot beans"]
    a: "You can. Bring the beans to a proper boil on the stove for ten minutes first, then move them to the slow cooker on high. Some beans, especially red kidney beans, must boil hard before slow cooking, so I always do it, for every bean. It's a good habit."
    tags: [technique, safety]
  - q: ["can i use a pressure cooker", "instant pot black beans"]
    a: "Yes, and it's much faster: unsoaked black beans take about 30 to 40 minutes at high pressure, then let the pressure come down on its own. Salt and epazote after, simmering ten minutes with the lid off. Not quite the olla, but on a busy day, nobody's complaining."
    tags: [technique]
  # REVIEW: Electric pressure-cooker time for unsoaked black beans (common guidance 25-40 min high + natural release). Confirm a range.
  - q: ["how do i store them", "how long do beans keep", "can i freeze beans", "leftover beans"]
    a: "In their broth, in the fridge, for four or five days. They freeze very well too, in their broth, for a few months — freeze them in portions so you can take out just a lunch. Cool them quickly; don't leave a big warm pot on the stove overnight."
    tags: [storage, safety]
  - q: ["what do i do with leftovers", "refried beans", "refritos", "enfrijoladas"]
    a: "Refritos: heat a little lard or oil, add beans with some broth, and mash as they fry until thick. Or blend beans with their broth and a little chile into a sauce, dip warm tortillas in it, fold them, and top with cheese and onion: enfrijoladas. Or just reheat a bowl with an egg on top. Beans are generous."
  - q: ["which beans can i use", "pinto beans", "can i use other beans", "kidney beans"]
    a: "Black beans for this dish. Pinto beans make a lovely pot too — that's how it's done in many other parts of Mexico. If you use red kidney beans, they must boil hard for ten minutes before you lower the heat; they're not safe undercooked."
    tags: [substitution, safety]
  - q: ["what is an olla de barro", "do i need a clay pot", "where to buy a clay pot", "is clay pot safe"]
    a: "A clay bean pot. It heats slowly and evenly and gives the beans a taste you can't buy. You don't need one; any heavy pot works. If you do buy one, buy one that says lead-free — 'sin plomo' — because some old glazes contain lead. And season it before using it, the way your pan was seasoned."
    tags: [safety]
  # REVIEW: Lead in traditional glazed Mexican cookware is a documented concern; Mexico runs lead-free certification campaigns. Confirm the 'sin plomo' wording and suggest a reviewer adds how to season an olla (commonly: rub with garlic/water, or boil with lime water).
  - q: ["why do beans give you gas", "beans gas", "skim the foam"]
    a: "Beans are fibre, and fibre keeps the body busy. If you eat beans often, it gets easier. Epazote, people say, helps a little; I can't promise, but I'm not stopping. The foam on top at the start is harmless; skim it if you like the look of a clear broth."
  # REVIEW: Epazote is traditionally said to reduce flatulence; evidence is limited. Kept as hearsay ("people say").
  - q: ["how much water", "how much water for beans", "water ratio"]
    a: "Cover the beans by about four fingers of water — for 500 g of beans, about two and a half litres. Then keep them covered by at least a finger as they cook. The broth is part of the dish, so don't let it get stingy."
