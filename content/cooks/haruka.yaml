faq:
  - q: ["how do i store onigiri", "storing onigiri", "how long do onigiri keep", "can i keep onigiri overnight"]
    a: "Onigiri are best the same day. Wrap each one tightly in cling film as soon as it's cool. Don't leave them out on a warm counter for more than a couple of hours; for a packed lunch, use an ice pack. They can go in the fridge, but the rice goes hard and dry there, so freeze them instead if you want to keep them."
    tags: [storage, safety]
  - q: ["can i refrigerate onigiri", "onigiri fridge", "rice hard in fridge"]
    a: "You can, and they're safe, but cold makes the rice hard and crumbly. Wrap them well, and warm them briefly in the microwave or toast them in a dry pan with a brush of soy sauce. That's yaki onigiri, and it's a reward, not a rescue."
    tags: [storage]
  - q: ["can i freeze onigiri", "freeze rice balls"]
    a: "Yes. Make them without nori, wrap each tightly in cling film while still slightly warm, and freeze. Microwave from frozen, still wrapped and loosened a little, until hot all the way through, then let it cool to warm and add nori. Pickled plum and salted fillings freeze better than mayonnaise ones."
    tags: [storage]
  - q: ["can i use long grain rice", "jasmine rice onigiri", "basmati rice onigiri", "what rice do i use", "what rice"]
    a: "Japanese short-grain rice. Medium-grain like Calrose works too. Long-grain rice, jasmine and basmati are excellent rice — but they're bred not to stick, and onigiri need rice that sticks to itself. They'll fall apart in your hand like a crowd leaving a station."
    tags: [substitution]
  - q: ["can i use sushi rice", "do i add vinegar", "sushi rice vinegar"]
    a: "'Sushi rice' in the shop is usually just Japanese short-grain rice — that's fine, buy it. But don't season it with vinegar. Onigiri is plain rice with salt on the outside. Vinegared rice is sushi, and sushi is a different shop."
    tags: [substitution]
  - q: ["can i use a rice cooker", "rice cooker onigiri"]
    a: "Yes. Rinse the rice, put it in, fill to the line for 'white rice' or 'short-grain', let it soak thirty minutes if your cooker doesn't do that itself, and press start. My rice cooker is the most reliable employee I have."
    tags: [technique]
  - q: ["why do you salt your hands", "salt on hands", "how much salt"]
    a: "So the salt is on the outside, where you taste it first, and so the rice doesn't stick to you. A small pinch rubbed over wet palms for each one or two onigiri. Not a handful. You are seasoning rice, not curing a ham."
    tags: [technique]
  - q: ["my onigiri fall apart", "rice won't hold shape", "onigiri crumbling"]
    a: "Three usual reasons: the rice was too cool when you shaped it, it's the wrong rice (long-grain), or you didn't press quite firmly enough. Shape while warm, use short-grain, and make the three or four presses count. Firm, not crushed."
    tags: [technique]
  - q: ["what fillings", "onigiri fillings", "what can i put in onigiri", "filling ideas"]
    a: "The classics: umeboshi (salted pickled plum), okaka (bonito flakes with a little soy sauce), salted grilled salmon, kombu simmered in soy sauce, and tuna with mayonnaise, which is the most popular in convenience stores and nobody should be ashamed of it. Or no filling at all — just salt. Shio musubi. My favourite, if I'm honest."
  - q: ["vegetarian onigiri", "vegan onigiri", "onigiri without fish", "no fish filling"]
    a: "Umeboshi alone, or shio kombu (salted kelp), or sesame and salt, or pickled vegetables, or a little miso. Check your labels: shio kombu and many pickles contain soy sauce, which has wheat. Your rules will flag anything that doesn't fit."
    tags: [substitution, safety]
  - q: ["what is umeboshi", "what does umeboshi taste like", "pickled plum"]
    a: "Ume — a Japanese apricot-plum — salted and dried and pickled, often with red shiso. Very sour and very salty. You use a little piece. The first one surprises everybody. The tenth one, you crave."
  # REVIEW: Ume (Prunus mume) is botanically closer to apricot; 'Japanese apricot' or 'plum' are both common in English. Fine either way.
  - q: ["what if i don't have nori", "no nori", "onigiri without seaweed", "seaweed allergy"]
    a: "Then don't use it. Onigiri without nori are still onigiri. Roll them in toasted sesame seeds, or furikake, or just eat them plain and salty. Many of the oldest onigiri had no nori at all."
    tags: [substitution]
  - q: ["should the nori be crisp or soft", "crispy nori", "soft nori", "when do i wrap the nori"]
    a: "Crisp: wrap just before eating. Soft: wrap right after shaping and let them sit. Osaka will argue for an hour about this. I say: crisp in the morning, soft for the train home."
  - q: ["can i use brown rice", "brown rice onigiri"]
    a: "Brown rice is less sticky, so it's harder. Mix half brown and half white short-grain, soak the brown longer, and press a little firmer. Or use a short-grain brown rice. It will be nuttier and more rustic. Rustic is fine."
    tags: [substitution]
  - q: ["can i use plastic wrap to shape", "cling film onigiri", "shape without touching rice"]
    a: "Yes. Lay a piece of cling film in your palm, sprinkle a little salt, add the rice and filling, then gather and shape through the film. Cleaner, especially if you're making them for other people, and no rice on your hands. I use bare wet hands in the shop because I've had twenty years of practice."
    tags: [technique]
  - q: ["how big", "how much rice per onigiri", "how many does it make"]
    a: "About 100 g of cooked rice each — a little less than a teacup's worth. Two rice-cooker cups of raw rice, 360 ml, make about six. Weigh the first one, then trust your hand."
