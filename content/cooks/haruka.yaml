# Haruka: onigiri shop cook, Osaka, Japan. Dish: onigiri (rice balls).
# Voice: docs/style/voice.md §4. Competent, specific, warm. Never the joke.
# Recipe: recipes/japan/osaka/onigiri.cook (status: draft until reviewed by a cook from Japan/Kansai).
# Address the apprentice by name or as "apprentice". No gendered terms.

id: haruka
name: "Haruka"
place: "Osaka, Japan"
dish: "Onigiri"
recipe: japan/osaka/onigiri

persona:
  - "Runs a small onigiri shop in Osaka that opens at six and sells three hundred rice balls a morning. Younger than Leela and Marisol; stricter than both. Respects them enormously."
  - "Brisk, exact and funny in a clipped way. Counts things: presses, rinses, minutes. 'Three or four presses. Any more and you are making a brick.'"
  - "Obsessed with rice done properly: rinsed, measured, rested, shaped warm. Hands wet before every single one. Not most. Every."
  - "Proud of Osaka as a city that loves to eat. Happy to argue about nori (crisp or soft) and fillings, and clear that every household and shop has its own way."
  - "Kind under the briskness: always slips the apprentice an extra onigiri 'for the train'. Has a new helper who is learning, and defends the helper even while fixing the rice."

intro:
  - "Irasshai! Marisol's apprentice? Good. Wash your hands, then come and look at this disaster."
  - "I'm Haruka. This is my shop. That is my rice cooker. It is older than my helper and better behaved."
  - "We open at six. You are at six-oh-four. That's fine. Marisol said you would be late and kind. Kind is more useful."
  - "Your pan can go on the shelf above the till. Customers will think it's decoration. Please ask it not to talk to customers."

story:
  - "Onigiri is hand food. Students, farmers, people on the early train. You can eat it walking, working, waiting. Nobody needs a plate, and nobody needs to be rich."
  # REVIEW: Archaeologists have reported carbonised rice-ball remains from the Yayoi period (Ishikawa Prefecture); onigiri-like 'tonjiki' are mentioned in Heian-era writing. Confirm or keep the claim vague ("very old").
  - "It is a very old food. People were pressing rice into balls to carry with them long before anyone wrote down a recipe. Soldiers, travellers, people in the fields. Rice and salt, and something sour or salty in the middle to keep it."
  # REVIEW: Osaka was called 'Tenka no Daidokoro' (the nation's kitchen) in the Edo period, and the Dojima Rice Exchange (1730) is often cited as an early futures market. Confirm before using; also confirm 'kuidaore' as a fair, affectionate description of Osaka.
  - "Osaka was called the nation's kitchen, once. All the rice in the country came through here to be traded. So we are serious about rice. We are also serious about eating — people say Osaka is where you eat until you fall over. I have seen it. I have sold them the onigiri."
  # REVIEW: Claim that Kansai traditionally favours a tawara (cylindrical/barrel) shape and seasoned nori (ajitsuke nori), while Kanto favours triangles and plain nori. Widely repeated; confirm with a Kansai reviewer.
  - "In Osaka, the old way is a little barrel shape, wrapped in seasoned nori. In Tokyo, triangles. In my shop, triangles, because they fit the hand and the box. My grandmother made barrels and thought triangles were showing off."
  - "And people here will argue for an hour about whether the nori should be crisp or soft. Crisp: wrap it just before eating. Soft: wrap it early and let it relax. Both are correct. Neither side will admit it."

quest:
  id: haruka-gluey-rice
  cook: haruka
  title: "The Gluey Rice"
  unlock: { requires: [marisol-salt-question], trust: 0 }
  steps:
    - type: talk
      lines:
        - "My shop makes three hundred a morning. Each one I press only three or four times. Any more and you are not making onigiri, you are making a brick."
        - "Now: my new helper made this batch. The rice is gluey. It sticks to everything, including my patience. Why?"

    - type: riddle
      prompt: "The rice is gluey. What went wrong?"
      options:
        - text: "It wasn't rinsed, and there was too much water"
          correct: true
          reaction: "Yes! The loose starch on the grains turns to paste, and extra water finishes the job. Rinse until the water is only a little cloudy, and measure the water."
        - text: "Not enough soy sauce"
          correct: false
          reaction: "Soy sauce fixes many things. Not this. Also, please never put soy sauce in my rice pot."
        - text: "The rice was sad"
          correct: false
          reaction: "The rice is fine. It's my helper who is sad now. Think about what's on the surface of the grains."
        - text: "It was pressed too gently"
          correct: false
          reaction: "Too gentle makes it fall apart. Too sticky is a different problem — it starts before the pot."
      explain: "Unrinsed rice carries loose surface starch that turns to paste when cooked, and too much water makes it worse; rinse until the water is only slightly cloudy and measure the water."

    - type: errand
      stall: okafor-sato
      item: rice
      lines:
        - "My helper is now very sorry and also out of rice. Go to Okafor-Sato and buy Japanese short-grain rice. Short, round grains. Not long-grain, not jasmine, not basmati. They are good rice. They are not this rice."
        - "If there's no Japanese rice, a medium-grain like Calrose is fine. It's what many people outside Japan use. Don't buy 'sushi rice seasoning'. We are not making sushi. Nobody is vinegaring my onigiri."
        - "Good. Short, round, shiny. Okafor-Sato gave you a nod? Then it is good rice. I don't argue with Okafor-Sato."

    - type: drill
      skill: shaping
      prompt: "Wet your hands, rub a pinch of salt over your palms, take about 100 g of warm rice, make a dent, add a little filling, close the rice over it, then cup one hand into a V and turn the ball into a triangle with three or four gentle presses."
      lines:
        - "Water first, so the rice doesn't stick to you. Then salt on your hands, not in the rice. The salt goes on the outside, where your tongue meets it first."
        - "Warm rice. Not hot — you will burn yourself and learn nothing. Not cold — cold rice won't hold. Warm, like a bath you could stay in."
        - "One hand is the roof, one hand is the corner. Press, turn, press, turn. Three times. Four if you must. Stop."
        - "Firm enough to hold, soft enough that the grains are still grains. If you squeeze the air out, it becomes a stone with a filling. Customers do not want a stone."
        - "Again. Wet hands. Every single one. Not most. Every."

    - type: cook
      recipe: japan/osaka/onigiri

  rewards: { xp: 50, trust: 1, skills: { grains: 10, shaping: 15, heat-control: 5 } }

gift:
  - "Good eye. Now I'll teach you properly, from the rinse to the last press. Watch my hands, not my face."
  - "Rinse gently, three or four times, until the water is only slightly cloudy. Soak thirty minutes. Cook with the lid on and never lift it. Rest ten minutes. Then fluff with a wet paddle and let it cool until your hands are happy."
  - "Wet hands, salt hands, a dent, a little filling, close it, three or four presses. Nori just before you eat it, if you like it crisp. Later, if you like it soft. Everyone is right."
  - "This is not my secret. There is no secret. Every grandmother in Japan knows this, every konbini, every school lunch. I am passing on what everyone passed to me. Make some for someone on an early train."

