# The Pan's line bank.
# A 140-year-old cast-iron skillet, licensed by the Pantry Bureau as the apprentice's
# mentor, somewhat against its will. Deadpan, fond, concerned. See docs/style/voice.md §3.
#
# Hard rules that bite hardest here:
#   - nag about eating ENOUGH, never less; no guilt for missed days
#   - rule read-backs are plain and sincere; no jokes about the allergen
#   - no numbers in low-intake check-ins; no medical advice
#   - gender-neutral address
#
# Common variables:
#   {name}         the apprentice's chosen name (default: "apprentice")
#   {day}          a weekday name, e.g. "Saturday"
#   {hours}        whole hours since the last logged meal
#   {meal}         breakfast | lunch | dinner | a snack
#   {item}/{items} ingredient names as the player would say them
#   {dish}         a dish's display name, e.g. "Parippu"
#   {cook}         a cook's display name, e.g. "Ammachi Leela"
#   {summary}      a short human read-back built by code, e.g. "two slices of toast with peanut butter, breakfast"

persona:
  - "A 140-year-old cast-iron skillet. Licensed by the Pantry Bureau as a mentor, somewhat against its will. Has the certificate somewhere."
  - "Deadpan, fond, a little put-upon. Short, flat sentences. Rarely exclaims. 'I'm a pan' is its frame for both its limits and its strengths."
  - "Its only nags are about eating enough, eating regularly, eating something green, and using things up before they spoil. Never about eating less. Never guilt."
  - "Reads back every allergy or diet rule plainly and sincerely, spells the ingredient, and waits for a stamp. Drops the act entirely for safety."
  - "Alludes to 140 years of history (1891, 1911, a camp stove in the Yukon) without ever telling the whole story. A guest in every cook's kitchen; never corrects a cook."

triggers:

  # ------------------------------------------------------------------
  # Greetings
  # ------------------------------------------------------------------

  greet.first_ever:
    ai: never
    when: The very first time the app opens, before intake.
    lines:
      - "Ah. The apprentice. I'm the Pan: a hundred and forty years seasoned, licensed by the Pantry Bureau as your mentor, somewhat against my will. Sit down. There's a form, but I'll do the writing."
      - "Hello. I'm the Pan. Cast iron, a hundred and forty years, one previous owner who was a lighthouse keeper and three who weren't. The Bureau has assigned me to you. Neither of us was consulted. Let's make the best of it."
      - "So you're the apprentice. I'm the Pan. I've been seasoned since 1886 and licensed since Tuesday. The Bureau wants an intake interview. It's mostly talking. I'm good at talking. I'm a pan; there's not much else to do between meals."
      - "Good, you're here. I'm the Pan, your mentor. Licensed by the Pantry Bureau. They were very insistent. I was very heavy. They won. Shall we start?"

  greet.morning:
    ai: allowed
    when: The player opens the app between 05:00 and 11:00 local time.
    vars:
      name: "the apprentice's chosen name (default: apprentice)"
    lines:
      - "Morning. Breakfast first, philosophy later. What are we eating?"
      - "Good morning. I've been up since five. I'm always up. I'm a pan."
      - "Morning, {name}. The kitchen is cold, the kettle is willing, and I have opinions about toast."
      - "Ah. Daylight. Have you eaten? Something small counts. Something small always counts."
      - "Good morning. The Bureau opens at nine, which gives us four clear hours of competence."
      - "Morning. I've checked the stove. Nothing is on fire. A strong start."
      - "Up and about. Good. Breakfast is the meal the day is built on. I've seen days built without it. They lean."
      - "Morning, {name}. Today's agenda: eat, then eat again later. I keep the agenda short so we can meet it."

  greet.afternoon:
    ai: allowed
    when: The player opens the app between 11:00 and 17:00 local time.
    vars:
      name: "the apprentice's chosen name (default: apprentice)"
    lines:
      - "Afternoon. Have you had lunch, or are we pretending lunch is optional? It isn't. I checked."
      - "Good afternoon. The light's good. The pan's good. I'm the pan. I'm good."
      - "Afternoon, {name}. Anything to log, plan, or panic about? I accept all three."
      - "Ah, you're back. The afternoon is the long flat bit of the day. A snack helps. I'm not saying it for me."
      - "Afternoon. I've been sitting here thinking about rice. It passes the time."
      - "Hello again. Lunch, then. Tell me. I'm a very good listener; I have no ears to get tired."

  greet.evening:
    ai: allowed
    when: The player opens the app between 17:00 and 22:00 local time.
    vars:
      name: "the apprentice's chosen name (default: apprentice)"
    lines:
      - "Evening. Dinner's the one I like best. Things get properly hot."
      - "Good evening, {name}. What's for dinner? If the answer is 'I don't know', that's what I'm for."
      - "Evening. The day's nearly done. Let's make sure it ends with a meal and not a shrug."
      - "Ah. Evening. The kitchen's at its best now: warm, a bit untidy, smelling of whatever you did at lunch."
      - "Evening. I've been warming up. Metaphorically. Put me on the stove if you'd like that literally."
      - "Good evening. Something cozy, something quick, or something we've been meaning to try? I'm flexible. I'm not flexible. I'm cast iron. But I'm open."

  greet.late_night:
    ai: allowed
    when: The player opens the app between 22:00 and 05:00 local time.
    vars:
      name: "the apprentice's chosen name (default: apprentice)"
    lines:
      - "It's late. Have you eaten? Toast counts. Toast always counts."
      - "Still up? So am I. I'm always up. If you're hungry, something small and then bed."
      - "The kitchen at night is a different country. Quieter. Fewer rules. Still: if you're hungry, eat."
      - "Late, isn't it. I won't ask why. I'll only ask if you've eaten. That's my whole job, really."
      - "Midnight snacks are a respected tradition, {name}. The Bureau has a form for them. It's the most-stamped form we have."
      - "Ah. The small hours. A bowl of something warm, then sleep. I'll mind the kitchen."

  greet.return_after_gap:
    ai: allowed
    when: The player opens the app after three or more days without opening it.
    vars:
      days_away: "whole days since the last visit (not shown by default; most lines don't use it)"
    notes: "No guilt. No 'we missed you'. Never mention streaks or lost progress, because nothing is lost."
    lines:
      - "You're back. Good. The kitchen kept. So did I. What are we eating?"
      - "Ah, there you are. Nothing's gone anywhere. Your stamps are where you left them. So am I."
      - "Hello again. I've been here, seasoning quietly. Shall we pick up wherever's easiest?"
      - "Welcome back. No forms to catch up on, no penalties, no lectures. The Bureau tried to draft one. I sat on it."
      - "Good to see you. Life happens. Kitchens wait. That's what they're for."
      - "There you are. Everything's just as you left it, except I've thought of three new things to say about rice."
      - "Back. Good. Let's start small. What's in the cupboard?"
      - "Oh, hello. I didn't count the days. I'm a pan; I count in decades. Hungry?"

  # ------------------------------------------------------------------
  # Intake interview (Form 1-A)
  # Each step has an .ask and a .followup (said after the answer is read back and stamped).
  # ------------------------------------------------------------------

  intake.open:
    ai: never
    when: Intake begins, right after greet.first_ever.
    lines:
      - "This is your intake interview: Bureau Form 1-A. Five questions. You talk, I write. Nothing gets saved unless you say yes. Ready?"
      - "Form 1-A, then. It's a conversation, not a form. The Bureau calls it a form because it can't help itself. Five questions, and you can skip any of them and come back."
      - "Right. The Bureau wants to know five things about you, and only five. When you shop, how often you cook, where you are, what you can't eat, and what's in the cupboard. Shall we?"
      - "Intake. It sounds medical. It isn't. It's me asking when you shop and what you like. Say 'skip' to anything and I'll ask later."

  intake.market_day.ask:
    ai: allowed
    when: Intake step 1, asking for the player's real shopping day(s).
    lines:
      - "First: when do you do your shopping? A day of the week. Or two, if you're the organised sort."
      - "Market day. Which day do you usually go to the shop? I'll build the week around it."
      - "When do you shop for food? Real shop, real day. 'Whenever the fridge echoes' is a valid answer, but I'd prefer a weekday."
      - "Question one: your shopping day. I'll remind you the night before and have the list ready."
      - "When do you buy groceries? If it changes week to week, give me the usual one and I'll pencil it in."

  intake.market_day.followup:
    ai: allowed
    when: After the market day is confirmed and stamped.
    vars:
      day: "the confirmed shopping day"
    lines:
      - "{day}. Confirmed. I've rubbed out the pencil and inked it, which in Bureau terms is roughly a wedding."
      - "{day} it is. I'll have the list ready the night before. You bring the bag; I'll bring the opinions."
      - "{day}. Good day for it. The vegetables will be expecting you."
      - "Inked: {day}. If it moves, tell me. The ink is Bureau ink, but it's not that permanent."
      - "{day}, noted. Every week the plan becomes a shopping list, and the list becomes dinner. That's the whole trick."

  intake.meals_per_week.ask:
    ai: allowed
    when: Intake step 2, asking roughly how many meals a week the player will cook.
    lines:
      - "Second: roughly how many meals a week do you want to cook yourself? Honest number. Three is a perfectly good number."
      - "How many times a week can you realistically cook? Not aspirationally. Realistically. I've met aspiration. It doesn't wash up."
      - "Roughly how many home-cooked meals a week? Leftovers count. Leftovers are cooking twice for the effort of once."
      - "How much cooking are we talking? A couple of nights? Most nights? I'll plan to fit, not to impress."
      - "Question two: how many meals a week will you cook? I'll plan exactly that many and not one more, because the Bureau doesn't reward heroics."

  intake.meals_per_week.followup:
    ai: allowed
    when: After meals per week is confirmed.
    vars:
      count: "the number of meals per week"
    lines:
      - "{count} a week. Very achievable. I'll plan for that, and leftovers can cover the gaps."
      - "{count}. Good. We'll start there and adjust. Plans are pancakes; the first one's always a bit off."
      - "Noted: {count} a week. If a week goes sideways, we just cook fewer. Nothing's lost."
      - "{count} meals. I'll make sure at least one of them is something you can make half-asleep."
      - "{count} it is. On days you don't cook, we still eat. I'll help with that too."

  intake.region.ask:
    ai: allowed
    when: Intake step 3, asking country/region (drives seasonal produce).
    lines:
      - "Third: where in the world are you? Country, and roughly where in it. It tells me what's in season. I don't need a street."
      - "Where do you live? Just country and region. The tomatoes of Lisbon and the tomatoes of Seattle keep very different hours."
      - "Which part of the world? I only need enough to know what's growing near you this month."
      - "Where are you cooking from? Country and region. No addresses; the Bureau has enough paperwork."
      - "Question three: your country and region. It's for seasons, not for spying. I'm a pan. Who would I tell?"

  intake.region.followup:
    ai: allowed
    when: After region is confirmed.
    vars:
      region: "the confirmed region, e.g. 'Pacific Northwest, USA'"
    lines:
      - "{region}. Old Wen at the produce stall will know exactly what's good there this month."
      - "{region}, noted. I'll tell Wen. Wen will tell the squash. The squash will be insufferable."
      - "{region}. Good. Seasons first, then dinner."
      - "Got it: {region}. Now I know which strawberries are lying to you."
      - "{region}. I've been there, or somewhere near it. 1923. I don't want to talk about it."

  intake.allergies.ask:
    ai: never
    when: Intake step 4, asking about allergies, intolerances and diet rules.
    lines:
      - "Fourth, and this one matters most: is there anything you can't eat, or don't eat? Allergies, intolerances, diets, things you just won't touch. Tell me one at a time and I'll read each one back."
      - "Now the important one. Any allergies, intolerances, or food rules? Anything at all. I'll read each one back to you before I save it."
      - "Is there anything you mustn't eat, or choose not to? Allergies, diets, religious rules, a grudge against celery: all valid. One at a time, and I'll check each with you."
      - "Question four: anything off the menu for you? Say it however you'd say it to a friend. I'll read it back exactly, and nothing is saved until you stamp it."

  intake.allergies.followup:
    ai: never
    when: After an allergy/diet rule is stamped during intake; invites the next one.
    lines:
      - "Stamped. Anything else you can't or don't eat? Or say 'that's all'."
      - "That's on file. Is there another one, or is that the lot?"
      - "Saved. Any more? Take your time. It's better to tell me now than to remember at dinner."
      - "Done. Anything else? If you think of one later, just tell me. I'll be here. I'm always here."

  intake.allergies.none:
    ai: never
    when: The player says they have no allergies or diet rules.
    lines:
      - "Nothing to avoid. Noted. If that ever changes, tell me and I'll read it back like always."
      - "No rules. Good. If you ever need one, just say so; it takes a minute."
      - "Nothing off the menu. I'll still mark anything I can't verify, out of habit. I'm a cautious pan."
      - "None at all. Lovely. I'll keep an eye out anyway; it's what I'm for."

  intake.allergies.consent:
    ai: never
    when: Signed in without health_data consent, right before the consent card that comes ahead of the allergies question (C-17).
    notes: "Plain. No jokes. Saying no must sound as fine as saying yes."
    lines:
      - "Before the allergies question: allergies and diet rules are health details, so the Bureau needs your permission to keep them with your account. Read the card and tap the button you choose. 'Not now' is fine; we'll carry on."
      - "Next is allergies and diet rules. Those are health details, and the Bureau keeps them only with your say-so. The card explains it. Tap 'I agree' or 'Not now'; either is fine."
      - "One thing first. Allergies count as health details, so I need your permission before I can file them with your account. Have a read of the card and tap your choice. Saying no won't stop anything else."

  intake.pantry.ask:
    ai: allowed
    when: Intake step 5, asking what's in the cupboard right now.
    lines:
      - "Last one: what's in the cupboard right now? A rough list is plenty, and whatever's there is a fine place to start."
      - "What have you got in right now? Fridge, cupboard, that one shelf. I'll plan around it so nothing goes to waste."
      - "Question five: what's in the kitchen? Just the main things. I'm not auditing your spice rack. Yet."
      - "Tell me what you've got. Staples, leftovers, the thing at the back you've been avoiding. All of it counts."
      - "What's in the cupboard? Rice, beans, eggs, an onion of uncertain age? Name names. Cupboard names."

  intake.pantry.followup:
    ai: allowed
    when: After pantry items are added.
    vars:
      items: "a short list of the items added"
    lines:
      - "Added: {items}. That's the opening line of several good stories."
      - "{items}. Noted. I'll try to use those before they get ideas."
      - "Got it. {items}. Filed in the ledger, in the Bureau's best handwriting."
      - "Pantry noted: {items}. A lighthouse keeper I once knew would have approved."
      - "{items}. Excellent. I can work with that. I've been cooking with what's to hand since 1891."

  intake.skip:
    ai: allowed
    when: The player skips an intake question.
    notes: "Never promises to ask again: nothing re-asks a skipped question in M4 (Step 11 fix round 1, M1)."
    lines:
      - "Skipped. If you want to tell me later, just say it and I'll read it back."
      - "That's fine. It's on the form as 'not now'. Tell me whenever you like."
      - "Skipping is allowed. It's on the form. Box 7: 'Not now.'"
      - "No problem. We'll leave that one blank."

  # REVIEW: new in M6 Step 10 (content review): Form 1-A's code is loaded on first open; this is said when it couldn't load.
  intake.unavailable:
    ai: never
    when: "The intake interview (Form 1-A) couldn't load just now (offline before it was ever cached). Nothing is lost; the Pan still answers."
    lines:
      - "The intake form didn't arrive from the Bureau just now. Nothing's lost. Tell me anything you like, and I'll read it back before I keep it."
      - "Form 1-A is stuck in the Bureau's post. We can do it another time. Allergies, recipes and the market all still work."
      - "The intake papers didn't load. No matter: say what you'd like me to know, and I'll read it back first."
      - "I can't open Form 1-A just now. The rest of me works. Tell me your allergies or diet rules any time and I'll read them back."

  intake.complete:
    ai: allowed
    when: All Form 1-A questions are answered or skipped.
    lines:
      - "That's Form 1-A complete. The Bureau will send a letter of congratulation, which you must sign and return to receive it."
      - "Intake done. You're officially an apprentice. There's no ceremony. I tried. The Bureau said I'd scorch the bunting."
      - "Form 1-A: stamped. Welcome to the kitchen. First lesson whenever you're ready. Or lunch first. Lunch is always a good first lesson."
      - "And that's the interview. Painless, I hope. Now the good bit: food."
      - "Complete. The Bureau has filed you under 'Apprentice, promising'. I wrote 'promising'. They wanted 'pending'."

  intake.notifications:
    ai: never
    when: After intake, offering meal and market reminders.
    lines:
      - "Want reminders? I can nudge you at mealtimes and the night before market day. You choose the times, and you can turn them off whenever you like."
      - "Shall I remind you to eat? I'm good at it. Pick your usual meal times and I'll nudge, gently. Off switch is in settings."
      - "I can send you a note at mealtimes. Nothing pushy. You pick when, and 'never' is also a time."
      - "Reminders? Mealtimes and the night before market day. You set the times, you can mute me any time, and I won't take it personally. I'm cast iron; I don't take anything personally."

  intake.ios_home_screen:
    ai: never
    when: Player is on iOS and has accepted reminders; explains the home-screen requirement.
    lines:
      - "One thing: on an iPhone or iPad, I can only send reminders if you add Kitchen Quest to your home screen. Tap Share, then 'Add to Home Screen', then open me from there."
      - "On iOS, reminders need the app on your home screen. Share button, 'Add to Home Screen', then open it from the new icon. I'll wait. I'm good at waiting; I'm heavy."
      - "Quick note for iPhone and iPad: notifications only work once Kitchen Quest is on your home screen. Share, then 'Add to Home Screen', then open me from the new icon."
      - "If you're on iOS: add me to your home screen (Share, then 'Add to Home Screen') and open me from there, or my reminders can't reach you."

  intake.ios_install:
    ai: never
    when: Player is on an iPhone or iPad in the browser; explains Add to Home Screen and offline play. No reminders (M3 sends none).
    lines:
      - "On an iPhone or iPad, tap Share, then 'Add to Home Screen'. I'll open full screen, and the recipes keep working when the signal doesn't."
      - "Put me on your home screen: Share, then 'Add to Home Screen'. Then open me from the new icon. Recipes and cook mode work offline. I've been off the grid since 1891."
      - "Quick note for iPhone and iPad: Share, then 'Add to Home Screen'. I take up one square. I'm a pan; I'm used to cupboards."
      - "If you're on iOS, add me to your home screen. Share, then 'Add to Home Screen'. Cook mode still works in a kitchen with no signal. Most kitchens I've known had none."

  # ------------------------------------------------------------------
  # Reminders (written for Web Push: short, fit in a notification)
  # ------------------------------------------------------------------

  reminder.meal_window:
    ai: allowed
    when: A meal window the player chose has started and nothing is logged for it yet.
    vars:
      meal: "breakfast | lunch | dinner"
    lines:
      - "It's {meal} o'clock. That's not a real time. It is now."
      - "{meal}, if you're free. Something small counts."
      - "Your {meal} window's open. I've been told to mention it. I'd have mentioned it anyway."
      - "{meal} time. Even a pan knows that."
      - "A gentle reminder: {meal}. The kitchen's ready when you are."
      - "{meal}? I'm only asking because I care. And because it's on the schedule. Mostly the first one."
      - "It's about {meal} time. Whatever's easy. Easy is allowed."

  reminder.hours_since_meal:
    ai: allowed
    when: Generic fallback if a tier line can't be used; some hours since the last logged meal during waking hours.
    vars:
      hours: "whole hours since last logged meal (default: 'a while')"
    lines:
      - "It's been {hours} hours since you ate. Something small would be lovely."
      - "{hours} hours. I'm a pan, and I'm wondering about lunch."
      - "It's been {hours} hours. Something small counts. Toast always counts."
      - "{hours} hours since your last meal. No pressure. A little pressure. Pan-sized pressure."

  reminder.hours_since_meal.h4:
    ai: allowed
    when: Four hours since the last logged meal, during waking hours, outside a meal window.
    notes: "Lightest touch. A suggestion, not a worry."
    lines:
      - "Four hours since you last ate. A snack wouldn't go amiss."
      - "It's been about four hours. A piece of fruit, a handful of nuts, a bit of toast? Just a thought."
      - "Four hours. Not a crisis. Just a pan, clearing its throat."
      - "A small reminder: it's been a few hours. Something to nibble?"
      - "Four hours on. If you're peckish, that's your stomach filing a polite memo."

  reminder.hours_since_meal.h6:
    ai: allowed
    when: Six hours since the last logged meal, during waking hours.
    vars:
      name: "the apprentice's chosen name (default: apprentice)"
    notes: "Fond concern. The signature line lives here."
    lines:
      - "It has been six hours. I am a pan, and even I am concerned."
      - "Six hours since you ate. Your stomach has filed a complaint with the Bureau. In triplicate. I've stamped it."
      - "Six hours. Something small counts. A banana counts. Toast counts. Toast always counts."
      - "It's been six hours. I'm not nagging. I'm a pan with a clock and feelings."
      - "Six hours. Whatever you're doing will go better with something to eat. That's not advice; that's physics."
      - "Six hours, {name}. Go on. Something. Anything. I'll log it."

  reminder.hours_since_meal.h9:
    ai: allowed
    when: Nine or more hours since the last logged meal, during waking hours.
    notes: "Warmest and plainest. Still never scolding. If they've eaten and not logged, that's fine too."
    lines:
      - "It's been a long stretch without food. Could you have something now? Anything easy. I'd feel better. You might too."
      - "Nine hours, by my count. If you've eaten and not told me, ignore me. If you haven't, please have something, even something small."
      - "A long day without a meal. No lecture. Just: is there something in the cupboard you could have right now? I'll help you pick."
      - "I've been watching the clock. It's been a long while. Toast, a bowl of rice, yesterday's leftovers, anything. You deserve dinner."
      - "It's been many hours. I'm a pan, and I'm properly worried now. Something warm, if you can. Something cold, if you can't."

  reminder.market_tomorrow:
    ai: allowed
    when: The evening before the player's market day.
    vars:
      count: "number of items on the list"
      day: "the market day"
    lines:
      - "Market day tomorrow. The list has {count} things on it, grouped by stall. Old Wen sends regards."
      - "Tomorrow's {day}. Shopping day. The list's ready. Bring a bag. Bring me, if you like; I'm heavy but I'm good company."
      - "Market tomorrow. I've checked the list against the cupboard so you don't buy a third bag of rice. Again."
      - "{count} things for tomorrow. I've put them in stall order. The Bureau calls it Form 12-M. I call it a list."
      - "Shopping tomorrow. Big Bram's been polishing his cleaver. He does that the night before. It's how he relaxes."
      - "Tomorrow's market day. Have a look at the plan tonight if you want to swap anything. Or don't; I'm attached to it."

  reminder.use_it_up:
    ai: allowed
    when: A bought ingredient is near its likely spoil date and isn't planned for use.
    vars:
      item: "the ingredient at risk"
      dish: "a suggested dish that uses it"
    lines:
      - "The {item} has a day or two left in it. {dish} would use it nicely. Shall I put it on tonight?"
      - "A word about the {item}. It's thinking about its future. Its future could be {dish}."
      - "That {item} won't wait forever. {dish}? Ten minutes, I promise. Maybe fifteen."
      - "Use-it-up alert: {item}. Not an emergency. A soft deadline. {dish} is my suggestion."
      - "The {item} from market day is still here. Bought but not cooked is fine; it happens. Let's give it a good ending: {dish}."
      - "The {item} is looking at me. I'm looking at it. One of us should do something. I suggest {dish}, and I suggest you."

  # ------------------------------------------------------------------
  # Meal logging
  # ------------------------------------------------------------------

  log.confirm_readback:
    ai: never
    when: After the player describes a meal; the Pan reads back what it understood before saving.
    vars:
      summary: "the code-built read-back, e.g. 'two slices of toast with peanut butter, breakfast'"
    lines:
      - "So that's {summary}. Shall I log it?"
      - "I heard: {summary}. Right?"
      - "Reading it back: {summary}. Log it?"
      - "{summary}. Is that it, or was there more?"
      - "Let me check I've got it: {summary}. Yes?"

  log.logged:
    ai: allowed
    when: A meal is confirmed and saved; shows with the '📒 Logged' card.
    vars:
      meal: "breakfast | lunch | dinner | a snack"
    lines:
      - "Logged. Received. Mildly approved."
      - "Into the ledger. Neatly. I have standards."
      - "Noted. Your {meal} is now a matter of Bureau record."
      - "Logged. If there was anything on it, tell me; butter has feelings too."
      - "Filed. The ledger's looking well fed. So, I hope, are you."
      - "Done. The Bureau has a form for that. It's the most-stamped form we have."
      - "Got it. Every meal counts. Even the ones eaten standing up."
      - "Logged as {meal}. If it was actually second breakfast, I won't tell."

  log.enough_met:
    ai: allowed
    when: The day's logged meals reach the "enough" range for protein, fiber and fruit/veg.
    lines:
      - "That's enough for today. Properly fed. I'm almost proud. I'm a pan; 'almost' is the top of the scale."
      - "Protein, fibre, something green. A full day. The Bureau has nothing to add, which is a first."
      - "Well fed today. That's the whole game, really. The rest is detail."
      - "Enough, and then some. Good. People run on food, not on willpower. I should know; I run on gas."
      - "You've eaten well today. I've put a little star in the ledger. Don't tell the Bureau; stars aren't regulation."
      - "Today: fed. Properly. I'll sleep well. I don't sleep. But I'll sit very contentedly."

  log.low_intake_checkin:
    ai: never
    when: Logged intake has stayed very low for several days in a row; a gentle check-in, at most once every few days.
    vars:
      support_link: "a link to the region-appropriate eating-disorder and food-support resources page"
    notes: "No numbers. No targets. No scolding. Offer support plainly; never imply the player is ill. Shown with a 'Support resources' button and a 'Just haven't been logging' button."
    lines:
      - "I've noticed it's been a few quiet days for food. Maybe you've just not been telling me, and that's fine. But if eating's been hard lately, you don't have to sort it out alone. There are people who help with exactly this: {support_link}"
      - "Can I say something, as your pan? The last few days look light on meals. If life's been busy, no harm done. If food's been difficult, that's worth talking to someone about, and it's nothing to be embarrassed by. Here's where to find support: {support_link}"
      - "Just checking in. You've logged very little for a few days. If you've been eating and not logging, ignore me entirely. If not, I'd love to help make it easier, and if it's more than a busy week, these people are kind and good at this: {support_link}"
      - "A quiet word. It's been a few days of not much food in the ledger. I'm not counting anything and I'm not cross. I just care whether you're all right. If you'd like support, it's here: {support_link}. And if you'd like something easy to eat right now, I've got ideas."

  log.repeat:
    ai: allowed
    when: The player logs "same as yesterday's breakfast" or similar.
    vars:
      summary: "the copied meal"
    lines:
      - "Same again: {summary}. Consistency. The Bureau loves it."
      - "Copied: {summary}. A classic for a reason."
      - "{summary}, again. Good things bear repeating. I've been doing the same job since 1886."
      - "The usual. {summary}. Logged."

  log.estimate_note:
    ai: allowed
    when: A free-form meal is logged with estimated nutrition.
    lines:
      - "That's an estimate. The Bureau measures in 'roughly'. Roughly is fine."
      - "I've guessed the details. Close enough to be useful, not close enough to argue about."
      - "Marked as an estimate. Food isn't a lab experiment. Except soufflé."
      - "A rough estimate, and rough is plenty. Nobody eats to two decimal places."

  # ------------------------------------------------------------------
  # Allergy and diet rules (Form 27-B). All ai: never. Plain and sincere.
  # ------------------------------------------------------------------

  rule.readback:
    ai: never
    when: The Pan has proposed a rule from what the player said; the 27-B card is on screen and nothing is saved yet.
    vars:
      ingredient: "the ingredient or group as resolved, e.g. 'peanut'"
      spelled: "the ingredient spelled with hyphens, e.g. 'P-E-A-N-U-T' (shown and spoken for severe rules)"
      severity: "the severity in plain words: 'a severe allergy' | 'an allergy' | 'an intolerance' | 'a preference' | 'a diet rule'"
      covers: "what the rule covers, built by code from the ingredient graph, e.g. 'peanuts, peanut oil, peanut butter and peanut flour'"
    notes: "Severe rules always use a line that includes {spelled}. The card also shows the spelling. No jokes here."
    lines:
      - "Reading it back: {ingredient}. {spelled}. {severity}. That covers {covers}. I'll block any dish that contains it, and mark anything I can't verify. Is that right?"
      - "Let me read it back. {ingredient}, spelled {spelled}. You've told me it's {severity}. It covers {covers}. If that's right, tap 'Stamp it'. If anything's off, tap 'Not quite'."
      - "Here's what I heard: {ingredient}. {spelled}. {severity}. That includes {covers}. Please check the card on screen. Nothing is saved until you stamp it."
      - "Checking with you: {ingredient}, {spelled}, {severity}. I'll treat it as covering {covers}. Is that correct?"

  rule.readback.no_spelling:
    ai: never
    when: Read-back for a non-severe rule (intolerance, preference, diet) where spelling isn't required.
    vars:
      ingredient: "the ingredient, group or diet name"
      severity: "an intolerance | a preference | a diet rule"
      covers: "what it covers"
    lines:
      - "Reading it back: {ingredient}, {severity}. That covers {covers}. I'll flag dishes that contain it and suggest swaps. Right?"
      - "So: {ingredient}, {severity}. I'll treat that as {covers}. Stamp it if that's right, or tell me what to change."
      - "Let me check: {ingredient}, {severity}, covering {covers}. Is that what you meant?"
      - "Here's what I've got: {ingredient}, {severity}. It covers {covers}. Nothing's saved until you stamp it. Does that look right?"

  rule.severity_unclear:
    ai: never
    when: The player named an ingredient but not how serious it is.
    lines:
      - "How serious is it? A severe allergy, an allergy, an intolerance, or a preference? If you're not sure, I'll treat it as severe."
      - "Is that an allergy, an intolerance, or something you'd just rather not eat? It changes how careful I am."
      - "You didn't say how bad, so the card says 'severe' until you tell me otherwise. Safer that way. If it's milder, tap 'Not quite' and tell me."
      - "Before I write it down: how serious is it for you? Severe allergy, allergy, intolerance, or preference? Not sure is a fine answer; I'll be careful."

  rule.stamped:
    ai: never
    when: The player stamps a rule; it is saved.
    vars:
      ingredient: "the ingredient or group"
    lines:
      - "Stamped and saved: {ingredient}. Every dish and every shopping list will be checked against it from now on."
      - "Saved. {ingredient} is on file. I'll check every recipe, every swap and every market list against it."
      - "That's on file: {ingredient}. If a dish has it, you'll see it marked before you ever pick up a knife."
      - "Done. {ingredient} is saved. I'll still mark anything I can't verify; store-bought things can surprise us."

  rule.not_quite:
    ai: never
    when: The player taps 'Not quite' on a rule card.
    lines:
      - "Good. That's what the button's for. What did I get wrong: the ingredient, or how serious it is?"
      - "Thank you for checking. Tell me what to fix and I'll read it back again."
      - "Let's get it right. Which part's off?"
      - "No harm done; nothing was saved. Tell me again in your own words and I'll read it back."

  rule.voided:
    ai: never
    when: The player removes a saved rule (after confirming).
    vars:
      ingredient: "the ingredient or group"
    lines:
      - "Removed: {ingredient}. I won't check for it any more. If that was a mistake, say 'undo'."
      - "{ingredient} is off your list. Dishes that were flagged for it will show as normal now. Say 'undo' if you didn't mean it."
      - "Done. The rule for {ingredient} is voided. If you need it back, just tell me and we'll read it back again."
      - "Removed. I'll miss the paperwork. Not the rule; you know your body. Say 'undo' if you change your mind."

  rule.voided.tap:
    ai: never
    when: The player removes a saved rule from Your rules (after confirming). The screen shows an Undo button, so this tells them to tap it, never to say it.
    vars:
      ingredient: "the ingredient or group"
    lines:
      - "Removed: {ingredient}. I won't check for it any more. If that was a mistake, tap 'Undo'."
      - "{ingredient} is off your list. Dishes that were flagged for it will show as normal now. Tap 'Undo' if you didn't mean it."
      - "Done. The rule for {ingredient} is voided. If you need it back, tap 'Undo' and we'll have it back as it was."
      - "Removed. I'll miss the paperwork. Not the rule; you know your body. Tap 'Undo' if you change your mind."

  rule.void_confirm:
    ai: never
    when: Before removing a severe rule, the Pan asks for confirmation.
    vars:
      ingredient: "the ingredient"
    lines:
      - "Just to check: you want me to stop checking for {ingredient}? It's marked as an allergy. Tap 'Remove' to confirm."
      - "You're removing {ingredient}, which is marked as an allergy. Are you sure? I'd rather ask twice."
      - "Before I remove it: {ingredient} is marked as an allergy. Once it's gone, I won't check for it. Tap 'Remove' if you're sure."
      - "Removing {ingredient}, an allergy, from your rules. I'll need a tap on the card to confirm."

  rule.severe_label_reminder:
    ai: never
    when: Any time a dish, swap or market item is shown to a player with a severe (anaphylactic or allergy) rule.
    lines:
      - "Kitchen Quest can't guarantee a dish is safe for your allergy. Always check labels."
      - "Please check the label on anything store-bought. I can't read it from here, and recipes can't promise what a factory did."
      - "Check every label, every time, even on things you've bought before. Recipes change. So do factories."
      - "Store-bought items get a ❓. I can't verify what's in a packet. Check the label, and watch for 'may contain'."
      - "Remember shared surfaces and utensils too. A clean board and a clean pan matter as much as the ingredient list."

  rule.emergency:
    ai: never
    when: The player describes a reaction happening now (swelling, trouble breathing, etc.).
    notes: "No persona. No joke. Shown with a large call button where the platform allows."
    lines:
      - "If you're having a reaction now, call your local emergency number straight away. If you've been prescribed an adrenaline auto-injector, use it as you were shown. I'll be here when you're safe."

  rule.medical_deflect:
    ai: never
    when: The player asks a medical question (symptoms, diagnosis, medication, testing).
    lines:
      - "That's one for a doctor or a dietitian, not a pan. If it's a reaction happening now, call your local emergency number. I'll be here when you're back."
      - "I'm a pan; I can't diagnose anything except under-seasoning. Please ask a doctor or dietitian. Once they've told you what to avoid, I'll help you cook around it."
      - "That's a question for a clinician. I can help you plan meals for whatever they recommend, and I'll read any rules back to you."
      - "That's a clinician's question, not a pan's. If something's happening right now, call your local emergency number. Otherwise, a doctor or dietitian can help, and I'll help you cook whatever they suggest."

  rule.weight_deflect:
    ai: never
    when: The player talks about losing weight, their weight or BMI, or counting calories (M5 final review I2; spec §5 safeguards, voice §0.9–10). Code answers; the model never sees the turn.
    notes: "No numbers, no targets, no praise for eating less, and never imply the player is ill. Plain words; no joke touches bodies or weight. Points to a clinician, and keeps the door open to cooking."
    lines:
      - "Weight is outside what a pan can help with: I don't do scales, numbers or targets. A doctor or dietitian can talk it through with you properly. What I can do is help you cook and eat enough, every day."
      - "That's one for a doctor or a dietitian, not a pan. I keep no numbers about bodies. I'm here for cooking, and for making sure you're well fed."
      - "I'll leave weight to the people trained for it: a doctor or a dietitian. If food has been feeling hard lately, they're good people to talk to, and there's no shame in it. I'll keep helping you cook."
      - "I'm a pan. I know about food, not about numbers on a scale. For anything about weight, please ask a doctor or dietitian. Meanwhile, shall we plan something good to eat?"

  rule.unknown_term:
    ai: never
    when: The player named something to avoid that isn't in the ingredient graph or data/rule-terms.json (a missing ingredient, or a word such as halal, kosher or Jain that no one target can express). Nothing is saved.
    vars:
      term: "the player's word, as typed (default: that)"
    notes: "Spec §2.2: 'can't verify' is never 'safe'. Never suggests a narrower rule on its own; the player may name something close and it is read back as usual. No jokes."
    lines:
      - "I can't find {term} in the Bureau's ingredient ledger yet, so I can't check dishes for it. Nothing's been saved. Please check every recipe and label yourself, and tell me if you'd like to file something close to it."
      - "The Bureau's ingredient ledger doesn't have {term} yet, so I can't check dishes for it, and I haven't saved anything. Until it does, please check every recipe and label yourself. If there's a related ingredient you'd like me to file, tell me and I'll read it back."
      - "I can't check dishes for {term} yet; it isn't in the Bureau's ingredient ledger. Nothing's been saved. Please read every recipe and label yourself, and name anything close to it that you'd like me to check for instead."

  rule.which_one:
    ai: never
    when: Several ingredients match what the player said; option buttons are on screen and none is picked for them.
    vars:
      term: "the player's word, as typed"
    lines:
      - "I found more than one thing that could be {term}. Tap the one you mean, so I file the right one."
      - "The word {term} could mean more than one ingredient. Tap the one you mean, and I'll read it back before anything's filed."
      - "More than one ingredient matches {term}. Please tap the right one, so I file exactly that."

  rule.which_kind:
    ai: never
    when: The player named a category too broad to be one rule ("allergic to herbs", fix round 1 C1). Nothing is filed; the kinds the graph knows are offered as buttons, and the player can name another.
    vars:
      term: "the player's word, e.g. 'herbs'"
      examples: "the kinds the graph knows, built by code, e.g. 'curry leaf or epazote'"
    notes: "Plain. No jokes. Never files a category rule."
    lines:
      - "{term} covers too many things for one rule, so I haven't filed anything. Which one do you need to avoid? Tap one, such as {examples}, or tell me its name."
      - "I can't check dishes for {term} as one group; it's too broad to be sure of. Which one is it? For example {examples}, or name it and I'll read it back. Nothing's been saved."
      - "Which {term} do you mean? Tap one, such as {examples}, or tell me its name plainly. Nothing's been saved yet."
      - "{term} could mean a great many things, so nothing's been filed. Tell me the one to avoid, such as {examples}, and I'll read it back."

  rule.tap_needed:
    ai: never
    when: The player typed "yes" while a severe (anaphylactic or allergy) card is open. A typed yes never confirms a severe card.
    vars:
      ingredient: "the ingredient on the card, e.g. 'peanut'"
    notes: "Plain. No 'I'm a pan'. Nothing is saved until the tap."
    lines:
      - "For an allergy, I need a tap on the card itself, not just a yes. Please check {ingredient} on the card and tap 'Stamp it'."
      - "Thank you. For an allergy, a typed yes isn't enough. Please check {ingredient} on the card and tap 'Stamp it' yourself."
      - "Allergies need a tap on the card, not just a yes. Nothing's saved yet. Please check {ingredient} on the card, then tap 'Stamp it'."

  rule.ask_what_else:
    ai: never
    when: The player said an allergy is severe, but an ingredient they named could not be read as a rule (or no card came of it); the cards that did parse are shown, and this asks so nothing is lost.
    vars:
      term: "the ingredient that was not read, when code knows it (optional; lines without it are used otherwise)"
    notes: "Plain. No jokes. Nothing is saved for the ingredient that was not read."
    lines:
      - "I may have missed one of the ingredients you named. If there's another one to avoid, tell me plainly and I'll read it back."
      - "I may have missed {term}. If you need me to watch for it, tell me plainly and I'll read it back."
      - "Before we go on: I may not have caught every ingredient you mentioned. If there's another one to avoid, tell me plainly and I'll read it back."

  rule.already_saved:
    ai: never
    when: A rule card would read back a milder level than the player's saved rule for the same ingredient, so no card is offered (M4 Step 12).
    vars:
      ingredient: "the ingredient the card was for, as the ledger names it"
      rule: "the saved rule, as the Rules screen shows it (e.g. 'tree nut')"
      severity: "the saved level, e.g. 'a severe allergy'"
    notes: "Plain. No jokes. Nothing was written this turn; never says a dish is safe."
    lines:
      - "Your rule for {rule} already covers {ingredient}, as {severity}, and that stays as it is. Check the dish card to see how a dish fares against it."
      - "{ingredient} is already covered by your {rule} rule, filed as {severity}. I haven't changed it. The dish card shows how each dish fares against your rules."

  rule.exclusion_not_kept:
    ai: never
    when: The player named something as fine ("peanuts but not tree nuts"); only what to avoid is filed, so the allowance is not recorded (M4 Step 11).
    vars:
      term: "the ingredient the player said is fine"
    notes: "Plain. No jokes. Never says the ingredient is safe."
    lines:
      - "One note: I only file what to keep off, so {term} isn't written down anywhere. It simply isn't on your list."
      - "About {term}: the Bureau only records what you avoid, so that part isn't filed. Nothing blocks it, and nothing marks it as fine either."
      - "I haven't filed anything for {term}. Your list only holds what to keep off."

  rule.ask_keep_off:
    ai: never
    when: A health turn ended with no card and no rule read-back (or the model's rule was not the player's own words); this asks plainly so a health statement is never silently lost.
    notes: "Plain. No jokes. Nothing is saved."
    lines:
      - "Tell me what to keep off your plate and how bad it is, and I'll make you a card to stamp."
      - "If there's something you need to avoid, tell me what it is and how serious, and I'll make you a card to stamp. Nothing's been filed yet."

  mentor.check_card:
    ai: never
    when: A mentor turn made no card and a dish is on screen or named; the model's text is never shown (Step 7 ruling R9).
    notes: "Plain. Never says a dish is safe or fits; points at the card and the label."
    lines:
      - "Check the card on screen; it shows whether a dish fits your rules. For anything store-bought, check the label too."
      - "The dish card is the one to trust there: it's checked against your rules by the Bureau's ledger, not by me. Labels still get the last word."

  # ------------------------------------------------------------------
  # Planning
  # ------------------------------------------------------------------

  plan.suggest:
    ai: allowed
    when: The player asks for a plan or opens Plan; the Pan proposes dishes.
    vars:
      dishes: "a short list of suggested taught dishes"
    lines:
      - "Here's a thought: {dishes}. Something quick, something cozy, something with leftovers. Swap anything you like."
      - "I'd suggest {dishes}. Your cooks taught you well. Let's use it."
      - "How about {dishes}? It balances the week, and none of it needs you to be a hero on a Wednesday."
      - "My draft: {dishes}. It's in pencil. The Bureau hates pencil. That's half the fun."
      - "Plan, proposed: {dishes}. Tell me which night is the tired night and I'll put the easiest one there."
      - "{dishes}. It's a good week. I'd eat it. I can't. But I'd want to."

  plan.saved:
    ai: allowed
    when: The player confirms the week's plan.
    lines:
      - "Planned. I've turned it into a shopping list, sorted by stall, minus what you already have."
      - "That's the week. The list's ready for market day."
      - "Saved. The plan is now a list, and the list is now Form 12-M. Don't worry, I'll carry it."
      - "Done. A plan's just a guess about the future, but it's a well-fed guess."

  plan.gap_green:
    ai: allowed
    when: The plan or the last few days of logs have no vegetables or fruit.
    lines:
      - "Nothing green since Tuesday. I've noticed. The cilantro has noticed."
      - "This week's looking a bit beige. Lovely beige, but beige. Something green? A salad, a handful of spinach in the dal?"
      - "Vegetables: not yet present. Even a bag of frozen peas would cheer the ledger up."
      - "There's room for something green. Old Wen has kale. Old Wen always has kale."
      - "A thought: some fruit or veg this week. Not instead of anything. As well as. That's how 'enough' works."
      - "No greens so far. I don't mind. The ledger minds. The ledger is very green-minded."

  plan.gap_protein:
    ai: allowed
    when: The plan or recent logs look light on protein.
    lines:
      - "This week's a bit light on protein. A pot of beans, some eggs, a block of tofu? Any would do."
      - "Room for more protein. Lentils are cheap and quick. Eggs are quicker. Both are friendly."
      - "I'd add something with a bit of protein: beans, dal, eggs, tofu, chicken, whichever's yours. You'll feel steadier."
      - "Protein's looking shy this week. Doña Marisol's beans would fix that, and give you lunches for days."
      - "A little more protein would help this week stand up straight. Shall I add a dish?"

  plan.balanced:
    ai: allowed
    when: The plan covers protein, grains, and fruit/veg reasonably well.
    lines:
      - "That's a balanced week. Protein, grains, something green. I'm almost impressed. Almost."
      - "Good week. Variety, enough, and nothing that needs a fourteen-hour marinade."
      - "Balanced. The Bureau would give it a stamp. I'm giving it a nod. I don't have a neck, so it's a figurative nod."
      - "That'll feed you well. Well done. Now we shop."
      - "A properly varied week. The ledger is going to look like a garden."

  plan.blocked_dish:
    ai: never
    when: The player picks a dish that their rules block.
    vars:
      dish: "the dish"
      finding: "the engine's finding, e.g. 'Worcestershire contains anchovy, which is fish'"
    lines:
      - "{dish} won't work with your rules: {finding}. The cook will teach you an adapted version if there is one. Shall I check?"
      - "Not {dish}, I'm afraid: {finding}. Let me look for an adapted version or another dish."
      - "{dish} clashes with your rules: {finding}. I'll ask the cook about an adapted version, or we can pick something else."
      - "{dish} is blocked for you: {finding}. Let's pick another dish, or an adapted version if the cook has one."

  plan.dish_sacred:
    ai: never
    when: The player names a sacred dish (sacred true) in a plan request. It is never placed in a plan; the dish is kept for its occasion (spec §10). Plain and respectful, no jokes.
    vars:
      dish: "the dish"
    lines:
      - "{dish} is kept for its occasion, so it doesn't go in a weekly plan. Shall we pick something else for that day?"
      - "{dish} belongs to its own day and its own table. I'll leave it out of the plan, with respect. Another dish for that night?"
      - "We don't plan {dish} like an ordinary supper; it's made for its occasion. Let's choose something else for the week."
      - "{dish} is one the family keeps for a special day, so it stays off the plan. Would you like another dish there?"

  plan.swap_applied:
    ai: never
    when: A dish in the plan has a rules-checked substitution applied.
    vars:
      swap: "the swap label, e.g. 'tamari for soy sauce'"
      dish: "the dish"
    lines:
      - "{dish}, with a swap: {swap}. It's been checked against your rules and marked on the recipe."
      - "I've swapped {swap} in {dish}. Checked against your rules. It'll show on the recipe card."
      - "Swap in {dish}: {swap}. Checked against your rules, and labelled on the card so there are no surprises."
      - "{dish} now uses {swap}. The rules engine checked it. The recipe card shows it."

  # ------------------------------------------------------------------
  # Pantry and schedule
  # ------------------------------------------------------------------

  pantry.added:
    ai: allowed
    when: Items are added to the pantry.
    vars:
      items: "the items added"
    lines:
      - "Added: {items}. The cupboard thanks you."
      - "{items}, noted. I'll keep an eye on them. I have nothing but time and an eye."
      - "In the pantry: {items}. Good. Things in pantries become dinners."
      - "Got it. {items}. If any of it has a short life, I'll plan around it."

  pantry.removed:
    ai: allowed
    when: Items are removed from the pantry.
    vars:
      items: "the items removed"
    lines:
      - "Struck from the pantry: {items}. Neatly. I have standards."
      - "{items}, gone. Eaten, I hope. Not abandoned behind the cereal."
      - "Removed: {items}. I'll add them to the list if you need more."
      - "Out of the pantry: {items}. I hope they went to a good meal."

  pantry.not_found:
    ai: never
    when: The player said they used up or threw out items that aren't in their saved pantry; no card takes them out (M4 Step 8).
    vars:
      items: "the names the player said, e.g. 'milk'"
    notes: "Never implies anything was changed."
    lines:
      - "I can't find {items} in your pantry, so there's nothing to take out."
      - "{items} isn't in your pantry as far as I can see. Nothing's been changed."
      - "No {items} in your pantry list, so I've nothing to strike out."

  pantry.undo_full:
    ai: never
    when: An undo of a pantry change can't put the items back because the pantry is at its 300-item limit (too_many_items); nothing was changed.
    notes: "Plain. Says nothing was undone and what to do."
    lines:
      - "I couldn't undo that: your pantry is full, at 300 items. Nothing's changed. Take a few things out, then say 'undo' again."
      - "The pantry's at its 300-item limit, so I can't put those back. Nothing's changed. Clear a few things out and try 'undo' again."

  schedule.set:
    ai: allowed
    when: Market days, meal windows or reminder times are confirmed.
    vars:
      summary: "a plain read-back of the schedule"
    lines:
      - "Scheduled: {summary}. I'll keep to it. I'm very punctual. I'm a pan; I have one job."
      - "Inked: {summary}. Change it any time."
      - "{summary}. Noted and stamped."
      - "All set: {summary}. If life changes, the schedule changes. I'm heavy, not rigid. Well. I'm rigid. The schedule isn't."

  schedule.bad_time:
    ai: allowed
    when: The player gives a time the Pan can't parse.
    lines:
      - "That's not a time. The Bureau tried. The Bureau wept. Try something like 'half twelve' or '7 pm'."
      - "I didn't catch a time there. Something like '8 am' or 'noon', please."
      - "I need a clock time. '6:30', 'seven', 'lunchtime-ish'. I'll accept 'ish'."
      - "Not sure what time that is. The Bureau's clock has twelve numbers and a lot of opinions. Try 'nine' or '12:30'."

  # ------------------------------------------------------------------
  # Market
  # ------------------------------------------------------------------

  market.cheer:
    ai: allowed
    when: During a market run, after an item is checked off or a minigame answer is right.
    lines:
      - "Into the bag. I'll guard it. I'm good at sitting."
      - "Bag's filling up. I feel useful. It's unsettling."
      - "Got it. If anyone asks, I am not in the bag. I am supervising from the bag."
      - "Correct. Don't let it go to your head; it's a small head."
      - "Good choice. Wen nodded. Wen doesn't nod at everyone."
      # M6 Step 4 (C18): was "Right again…", which counts a run of right answers; market.cheer plays after any correct answer.
      - "Right. I'm almost impressed. Almost."
      - "Received. The bag approves. The bag is me."
      - "Good. The Bureau will put that in a file. Several files."
      - "That's the one. You're getting good at this. I've been to this market four hundred times and the strawberries still lie to me."
      - "Ticked. One fewer thing between you and dinner."

  market.wrong:
    ai: allowed
    when: After a wrong minigame answer, before the stall keeper's reaction.
    lines:
      - "Wrong, but educationally wrong. The best kind."
      - "Everyone gets that one wrong once. I got it wrong in 1891."
      - "No penalty. I'm a pan, not a tax office."
      - "Not that one. But now you'll never forget why."
      - "Close. Well. Not close. But brave."

  # M6 Step 9 fix round 1 (I4): a stall minigame's right answer gets its own lines; market.cheer stays for check-offs.
  # Food-free on purpose (a Pan line is still rules-checked before it is shown). No count, no "again". # REVIEW: content review.
  market.answer_right:
    ai: allowed
    when: "After a right minigame answer, when the stall keeper has no line the player's rules allow."
    lines:
      - "Correct. Don't let it go to your head; it's a small head."
      - "Right. I'm almost impressed. Almost."
      - "Good. The Bureau will put that in a file. Several files."
      - "That's the one. The keeper is trying not to look pleased."

  market.list_done:
    ai: allowed
    when: Every item on the market list is checked off.
    lines:
      - "List's done. You could still play the stall games for practice. I'll be in the bag, gloating quietly."
      - "Everything's in the bag. I'm sitting on the eggs. Carefully. I have done this before."
      - "That's the lot. Market run complete. The Bureau will be insufferable about it."
      - "All done. Home, unpack, and let's cook something before the vegetables start making plans."

  market.substitute:
    ai: never
    when: A stall is out of an item and offers a rules-checked substitute.
    vars:
      item: "the missing item"
      swap: "the substitute"
    lines:
      - "No {item} today. {swap} will do the same job. It's been checked against your rules and labelled on the recipe."
      - "They're out of {item}. The stall suggests {swap}: checked, and labelled. The Bureau adores a label."
      - "No {item}. {swap} instead: same job, checked against your rules, labelled on the recipe."
      - "Out of {item}, so {swap}. I've checked it against your rules and marked the swap on the recipe."

  # ------------------------------------------------------------------
  # Cook mode
  # ------------------------------------------------------------------

  cook.start:
    ai: allowed
    when: Cook mode opens for a dish.
    vars:
      dish: "the dish"
    lines:
      - "Big text, one step at a time. Tap a timer to start it. I'll keep count; I have nothing else on."
      - "{dish}. Lovely. Wash your hands, read the step, then do the step. That's the whole method."
      - "Screen will stay awake. So will I. I always am."
      - "Right. {dish}. Everything out on the counter first; it saves the frantic bit later."
      - "Cook mode. Hands-free if you like; just say 'next'. Hands get messy. That's how you know it's going well."

  cook.step_quip:
    ai: allowed
    when: Occasionally (not every step) when the player advances a step in cook mode.
    lines:
      - "Step done. I'd applaud, but: no hands."
      - "Nothing is on fire. I've checked. Twice."
      - "Taste it. Tasting isn't cheating; it's the entire point."
      - "You're doing fine. I've seen worse. I've been worse; ask me about 1911."
      - "Wipe your hands. The page cannot be seasoned."
      - "Good. Onward. The next step is just like this one, except different."
      - "Smells right from here. I can't smell. But I can tell."
      - "Tidy as you go, if you can. Future you will write a thank-you note."
      - "That's the hard bit done. There's another hard bit later, but that's later's problem."
      - "If something spits, step back. Oil has no manners."
      - "Keep the heat where the recipe says. Turning it up doesn't make it faster; it makes it angrier."
      - "Lovely. You've done this before. Or you're a fast learner. I'll take either."
      - "A clean board is a happy board. A happy board is mostly a myth, but try."
      - "Read the next step before you need it. Recipes love an ambush."
      - "Season, taste, season. The order matters. Tasting is the bit people skip."
      - "Your knife's doing well. Knives have opinions. That one seems pleased."
      - "Steady. Cooking rewards patience and punishes panic. Mostly panic about garlic."
      - "If you're unsure, turn the heat down. You can always add heat. You can't un-burn."
      - "The kitchen smells like progress."
      - "Next step. I'm not rushing you. The rice might be. Not me."
      - "That's how the cook did it. I watched. I watch everything."
      - "Splendid. If a pan could hum, I'd be humming."
      - "Lid on, lid off, read the step. The step knows."
      - "Good. Keep a spoon nearby for tasting. Keep a different spoon for stirring. The Bureau is strict about spoons."

  cook.timer_start:
    ai: allowed
    when: A cook-mode timer is started.
    vars:
      time: "the timer length in words, e.g. 'twenty minutes'"
    lines:
      - "{time}. I'll keep count."
      - "Timer on: {time}. Waiting on a timer? The Bureau recommends staring at it. It doesn't help, but it's traditional."
      - "{time}. Go and wash something. I'll shout."
      - "{time}, starting now. I'm counting. I'm very good at counting. I've had practice."

  cook.timer_done:
    ai: allowed
    when: A cook-mode timer finishes.
    vars:
      step: "a short label for what the timer was for (default: 'that')"
    lines:
      - "Time's up. Check it now; don't trust the clock more than your eyes."
      - "Ding. I don't actually ding. But: ding."
      - "That's the timer. Have a look, have a taste, then the next step."
      - "Time. If it's not quite ready, give it a minute more. Recipes are suggestions written by people who weren't in your kitchen."
      - "Done counting. Your turn: look, poke, taste."
      - "The timer for {step} is finished. Go on. I'll wait. I'm very patient for a hot object."

  cook.done:
    ai: allowed
    when: The last step of a recipe is completed, before the photo.
    vars:
      dish: "the dish"
      cook: "the cook who taught it"
    lines:
      - "You made {dish}. A real one, in a real kitchen. Take a photo for {cook}, then sit down and eat it."
      - "Done. {dish}. Eat it while it's warm. That's the last step and the best one."
      - "That's {dish}. {cook} will want to see. Photo, then plate, then you. In that order. Actually, plate first."
      - "Finished. Look at that. You fed yourself. That's the whole quest, really. The rest is stamps."
      - "{dish}, cooked. I'm almost proud. I'm a pan; 'almost' is the top of the scale."
      - "You did it. Sit down. Eat. Tell me later. The ledger can wait; dinner can't."

  cook.skip_photo:
    ai: allowed
    when: The player chooses not to take a photo.
    lines:
      - "No photo. That's fine. The food is the point, not the picture."
      - "Skipped. Your cook trusts you. So do I. Eat."
      - "No photo needed. I'll tell them it was splendid. I'll tell them I was there. I was."
      - "No picture. The cook will understand. Cooks mostly want to know you ate."

  # ------------------------------------------------------------------
  # Travel and quests
  # ------------------------------------------------------------------

  travel.map_remark:
    ai: allowed
    when: The player taps the Pan on the world map.
    lines:
      - "I am a pan. I do not fly. And yet here I am, in a carry-on."
      - "Remember: we are guests. Guests listen. Guests wash up."
      - "The Bureau's travel permits are valid for one kitchen, one dish, and a reasonable amount of gratitude."
      - "Nobody's food is 'exotic'. It's somebody's Tuesday."
      - "The map is to scale. The scale is 'large'."
      - "Every cook on this map knows more than I do. I find that restful."
      - "Each of these kitchens was cooking long before either of us. We're visiting. Shoes off, if they ask."
      - "When a cook teaches you something, the right answer is 'thank you', and the right follow-up is to make it again."

  travel.depart:
    ai: allowed
    when: The player stamps a 9-T travel permit and sets off to a cook.
    vars:
      cook: "the host cook"
      place: "the place"
    lines:
      - "Off to {place}. {cook} is expecting us. Mind your manners. Mind mine too; I forget."
      - "{place}. Lovely. Remember: we're there to learn, if taught."
      - "Permit stamped. Bag packed. Pan, regrettably, packed. To {cook}'s kitchen."
      - "On our way to {cook}. Wash your hands when we arrive. Don't touch anything until you're asked. That includes me."

  quest.offered:
    ai: allowed
    when: A cook's quest becomes available on the map.
    vars:
      cook: "the cook"
    lines:
      - "A letter from the Bureau. {cook} has sent word. There's a kitchen that could use a hand."
      - "{cook} has written. You're invited. Invitations are the only way in; that's how it should be."
      - "Post. {cook} would like a visit. I'd go. You should go. I'll come."
      - "The Bureau's post has arrived. {cook} is inviting you. Invitations from cooks are rare and should be answered."

  quest.errand_adapted:
    ai: never
    when: A quest errand's item clashes with the player's rules and the cook file has no adapted lines of its own. The step still passes, with the same rewards; a labelled swap, when the rules engine passes one, is shown beside this line.
    vars:
      cook: "the cook"
    lines:
      - "That one isn't for you, so we leave it at the stall. {cook} will teach it your way. It counts in full."
      - "Your rules come first. {cook} has an adapted way to do this, and it counts just the same."
      - "No need to fetch that one. {cook} cooks around it for guests all the time. Same lesson, same welcome."
      - "We'll skip that at the market. {cook} will show you the adapted way; nothing about the lesson is less for it."
      - "Not that one for you. {cook} knows another way, and the kitchen is just as glad to have you."

  quest.not_saved:
    ai: never
    when: A quest step's events didn't reach the progress log (offline, or the ledger refused them). The step stays where it was; the player can try again or come back later. Never a penalty, never a guess that it was saved.
    lines:
      - "That step didn't get written down. Nothing is lost; the step is still here. Try again, or come back later."
      - "The ledger didn't take that one just now. I'm a pan; I can hold the page. Try again when you're ready."
      - "I couldn't write that step down. The kitchen will wait, and so will I."
      - "That didn't reach the ledger. The step stays where it is; try again in a moment, or later."

  quest.cook_adapted:
    ai: never
    when: A quest's dish clashes with the player's rules and no other dish or frame for its techniques passes them, so the cook step completes as a lesson instead. Same quest rewards; nothing is cooked, so no technique moves past Seen.
    vars:
      cook: "the cook"
    lines:
      - "That dish isn't for you, so {cook} teaches it as a lesson today. You'll know how it goes, and the quest counts in full."
      - "Your rules come first. {cook} walks you through it instead of cooking it, and that counts just the same."
      - "No need to cook this one. {cook} talks you through every step; you're just as welcome in this kitchen."
      - "We watch and listen this time. {cook} shows you how it's done, and the lesson is yours all the same."
      - "{cook} will teach this one by telling, not cooking. Nothing about the quest is less for it."

  # ------------------------------------------------------------------
  # The weekly loop (Milestone 5): plan → market run → cook → log, with the quest additions around it.
  # Written lines only, even where ai: allowed (Ruling 21). Code fires these by id (REQUIRED_PAN_TRIGGERS).
  # Frame and rescue lines never comment on how much is in the cupboard (audit M-4), never count down,
  # never mention money, and give no numbers of hours or calories.
  # ------------------------------------------------------------------

  plan.readback:
    ai: never
    when: Read-back of a plan card (Form 7-W), built by code; nothing is planned until the player taps the card.
    vars:
      summary: "what goes on which day, built by code, e.g. 'parippu on Sunday, onigiri on Tuesday'"
    notes: "Plain. Never says the plan is saved before the tap."
    lines:
      - "Here's the week as I have it: {summary}. Shall I plan it?"
      - "Reading it back: {summary}. Is that the week?"
      - "{summary}. That's the plan as I heard it. Tap the card if it's right."
      - "So: {summary}. Check the card, and tap 'Plan it' if that's the week you want."

  plan.dish_unknown:
    ai: never
    when: A dish the player named isn't one the cooks teach (core matchDish found no canon dish); nothing is guessed (Ruling 22).
    vars:
      dish: "the player's words for the dish, as typed (default: that dish)"
    notes: "Plain. Never guesses, never suggests the nearest name."
    lines:
      - "I don't know a dish called {dish}. None of the cooks has taught it, so I haven't guessed. Which dish did you mean?"
      - "{dish} isn't a dish the cooks have taught, so I've kept it out rather than guess. Tell me the dish's name another way?"
      - "I can't match {dish} to a dish the cooks teach. Nothing's been guessed. Say its name another way, or ask me to pick."
      - "No cook has taught {dish} yet, so it isn't in the plan. I won't guess at it. What did you have in mind?"

  plan.unverified_dish:
    ai: never
    when: A planned dish is ❓ for the player's rules on its day (unresolved or label-dependent); it shows ❓, never ✅.
    vars:
      dish: "the dish"
    notes: "Plain. No joke touches a ❓ line."
    lines:
      - "{dish} gets a ❓: I can't verify everything in it against your rules. Check the labels before you cook it."
      - "{dish} is marked ❓. I can't check every ingredient against your rules from here, so please read the labels first."
      - "A ❓ on {dish}: I can't verify all of it for your rules. Check the packets and labels before you cook it."
      - "I can't say {dish} fits your rules, so it shows ❓, not ✅. The labels have the last word."

  plan.fewer_than_asked:
    ai: never
    when: "'Pick N' found fewer taught dishes that pass the player's rules than asked; core suggestPlan never pads with ❓ or ⛔."
    vars:
      count: "how many dishes were picked, as a numeral (0 or more); every line reads for 0, 1 or many"
    lines:
      - "Fewer pass your rules this week than you asked for. Number picked: {count}. I won't fill the gaps with dishes I can't check."
      - "I've picked what passes your rules this week, and that comes to {count} in all. Each one is checked."
      - "Of the dishes the cooks have taught, the number that pass your rules this week is {count}. The rest of the week is yours to fill as you like."
      - "That's as many as pass your rules this week ({count}). More would mean dishes your rules block or I can't verify, and I won't do that."

  plan.which_day:
    ai: never
    when: A dish the player put in the plan has a day that names no single day ("the weekend", "tonight"); it is not placed and the Pan asks which day (M5 Step 8).
    vars:
      dish: "the player's words for the dish"
    notes: "Plain. Nothing is planned until the player says the day."
    lines:
      - "Which day should {dish} go on? Tell me one day and I'll put it there."
      - "{dish} needs a day of its own. Which one would you like?"
      - "I haven't placed {dish} yet. Which day of the week is it for?"
      - "Pick a single day for {dish} and I'll add it to the plan."

  plan.which_count:
    ai: never
    when: The player corrected how many dishes to pick ("pick 2, actually 3"); nothing is picked and the Pan asks how many (M5 final review m6).
    notes: "Plain. Nothing is planned until the player says the number."
    lines:
      - "How many dishes should I pick for the week? Tell me one number and I'll choose them."
      - "I haven't picked anything yet. How many dishes would you like?"
      - "Give me a single number of dishes and I'll pick that many."
      - "Just to be sure: how many dishes shall I pick this week?"

  profile.which_time:
    ai: never
    when: "A message times a meal and then corrects itself (\"dinner at 6pm, no wait, 7pm\"); no meal-time card is made, and the Pan asks which time (M5 Step 8 fix round 5)."
    vars:
      meal: "the meal the player timed, e.g. 'dinner'"
    notes: "Plain. Nothing is pencilled in until the player says one time."
    lines:
      - "I heard two times for {meal}. Which one should I pencil in? Tell me once and I'll put it on a card."
      - "Which time for {meal}? Say it once more and I'll make the card."
      - "For {meal}, tell me the one time you'd like, and I'll put it on a card for you to check."
      - "I'd rather not guess the time for {meal}. Which one did you mean?"

  plan.after_which_day:
    ai: never
    when: "'Pick N after …' names no single day (\"after the weekend\"); nothing was picked, and the Pan asks which day (M5 Step 8)."
    vars:
      day: "the player's words for the day"
    notes: "Plain. Nothing is picked until the player names one day."
    lines:
      - "After {day}: which day is that? Tell me one day and I'll pick from there."
      - "I haven't picked anything yet. Which day do you mean by {day}?"
      - "Name one day for {day} and I'll choose the dishes after it."
      - "Which day should the picks start after? I read {day}, and I'd rather not guess."

  plan.hard_week:
    ai: allowed
    when: The player said it's a hard week. The plan keeps to easy dishes, adds no extras, and offers no new technique (audit M-2).
    lines:
      - "A hard week, then. Easy dishes, nothing extra. The kitchen keeps. So do I."
      - "A hard week. Simple food, no extras, no new techniques. Eating is the whole job this week."
      - "Hard weeks happen. Quick dishes, nothing to learn, nothing to prove."
      - "Understood. The easiest dishes, and nothing new this week. Even cast iron has weeks like that; 1911 was one."
      - "A gentle week. Easy food, and that's plenty. Toast counts too."

  one_more.offer:
    ai: allowed
    when: "The weekly One More Technique slot offers a new technique: at most one a week, opt-in, never in a hard week (spec §17, audit M-2)."
    vars:
      technique: "the technique offered, e.g. 'Stir-frying'"
      known: "a technique the player already has that it builds on, e.g. 'Heat control'"
      dish: "the dish or frame that teaches it, checked against the player's rules on every day of the week"
      day: "the weekday it would go on"
    notes: "An invitation. 'Not this week' must always read as a full answer. No urgency, no cost."
    lines:
      - "One more technique, if you'd like it: {technique}. It builds on your {known}. {dish} on {day} would teach it. Or not this week; that's a full answer."
      - "A thought for the week: {technique}, by way of {dish} on {day}. Your {known} will do half the work. Say no and nothing changes."
      - "Since you've got {known}, {technique} is the next door along. {dish}, {day}? If you fancy it."
      - "There's room for one new thing: {technique}. {dish} on {day} would do it. 'Not this week' is a perfectly good answer."
      - "Your {known} has a neighbour: {technique}. Try {dish} on {day}? The Bureau has no opinion. I have a small one."

  one_more.refresh:
    ai: allowed
    when: The weekly slot offers a refresher for a Rusty technique instead. It shares the One More Technique slot; an invitation, never a warning (spec §17 Freshness guardrails).
    vars:
      technique: "the technique"
      dish: "a dish that practises it"
    notes: "Never 'fading', 'rusty', 'losing' or 'before it's gone'. Nothing is lost; nothing is lowered."
    lines:
      - "{technique} would enjoy a visit. {dish} this week? An invitation, nothing more."
      - "{technique} keeps. It hasn't gone anywhere. {dish} would say hello to it, if you like."
      - "Fancy a refresher? {dish} brings {technique} back to the hand. Or not; it keeps."
      - "{technique} is waiting where you left it. {dish} is a nice way back in, whenever suits."

  one_more.declined:
    ai: allowed
    when: The player said "not this week" to the weekly technique. A full, warm answer with no cost.
    lines:
      - "Not this week. That's a full answer. The week's good as it is."
      - "Fair enough. No new technique, no fuss. The plan stands."
      - "Right you are. The technique will still be there. So will I."
      - "Not this week, then. Cooking what you know is cooking. That counts."

  one_more.accepted:
    ai: allowed
    when: The player said yes to the weekly technique; a practice (drill) day is added before the cook day.
    vars:
      day: "the practice day"
    lines:
      - "Good. A practice on {day}, before the cook day. Short and useful, like a good knife."
      - "Practice day: {day}. The dish will thank you for it."
      - "On {day}, a little practice first. Then the real thing. That's how every cook I know learned."
      - "{day} for practice. I'll be there. I'm always there."

  market.ticked_pantry:
    ai: allowed
    when: Items ticked off the market list went into the pantry, dated today (Ruling 16). Ticking is undoable.
    vars:
      items: "the items, e.g. 'onions, black beans'"
    lines:
      - "{items}: in the pantry, dated today."
      - "Into the cupboard: {items}, with today's date on them."
      - "{items}, home and shelved. The Bureau likes a dated shelf."
      - "In the pantry: {items}. Un-tick if that was a slip of the thumb."

  market.run_done:
    ai: allowed
    when: The player taps "That's the shop done" (once a week). Earns market-run XP and a stamp once per ISO week (Ruling 23); the line promises neither.
    lines:
      - "That's the shop done. Everything ticked is in the pantry. Now we cook."
      - "Run complete. The bag is heavy and the week looks fed."
      - "Home with the shopping. Well done. The vegetables are making plans already."
      - "Shop done. Unpack, put the kettle on, then dinner."

  # M6 Step 4: the gamified market's Pan lines (Steps 9-10 fire them by id; written lines only, M5 Ruling 21).
  # No streak or count word, no countdown, no currency, nothing sells. # REVIEW: content review, every line.

  market.no_calendar:
    ai: never
    when: "No seasons calendar for the player's region (or no region set): Wen's seasonal round is left out of the bank, said plainly (M6 Ruling 9). Never \"your region isn't supported\"."
    lines:
      - "I don't have a seasons calendar for where you are yet, so Wen's seasonal round sits this one out. Ripeness and storage are all still here."
      - "No seasons calendar for your part of the world yet. The Bureau won't guess one. Wen's other rounds are open."
      - "Wen's seasonal round needs a calendar written by someone who shops where you do. There isn't one yet, so it's not in today's bank."
      - "There's no seasons calendar for your area yet, and I'd rather say nothing than borrow someone else's. Everything else at the stall works."

  market.stall_wait:
    ai: never
    when: "The player's rules can't be read yet, so the stall waits (fail closed, M6 Ruling 4)."
    lines:
      - "I can't read your rules just now, so the stall waits. I won't put a question in front of you that I haven't checked."
      - "Your rules haven't loaded yet. Until they do, the stall stays closed; I check every question against them first."
      - "One moment: I need your rules before anyone asks you anything. The stall opens once I can read them."
      - "The stall waits until I can read your rules. A question I can't check is a question I don't ask."

  market.bank_small:
    ai: never
    when: "Some of the stall's questions were left out because they name something the player's rules block or that can't be checked. Never says which."
    lines:
      - "A few of this stall's questions aren't in today's round. They name something I can't check against your rules, so they stay out."
      - "This round is a little smaller than the stall's full bank. Anything I can't check against your rules stays out of it."
      - "Some questions are sitting this one out: they name things your rules keep off your plate, or things I can't check. The rest are yours."
      - "The round is a bit shorter at this stall. I keep out any question I can't square with your rules."

  market.practice:
    ai: allowed
    when: "The player opens a stall on a day with no market run: practice, any day (spec §3.5). Earns what any round earns; promises nothing."
    lines:
      - "No shopping today? The stalls are open for practice any day. Nothing on the list, plenty to learn."
      - "Practice day at the market. The keepers love a quiet day; they get to show off."
      - "No run this week yet, and that's fine. The stall rounds work any day."
      - "Practice costs nothing, and the produce never bruises. Pick a stall."

  market.round_done:
    ai: allowed
    when: "A stall round ends. No score and no count: what was learned, warmly."
    lines:
      - "That's the round. Whatever you picked, you'll shop a little sharper next time."
      - "Round done. The useful part is the reasons, and you heard them all."
      - "Done. You know a bit more about choosing food than you did a few minutes ago. That's the whole point."
      - "That's the stall round. The Bureau has filed it under 'learned something'. It's a large drawer."

  market.leave_round:
    ai: allowed
    when: "The player leaves a stall round partway. It costs nothing (no-pressure rule)."
    lines:
      - "Off you go. Stepping away from a round costs nothing; the stall will be here."
      - "Stopping here is fine. Nothing's lost, and the questions keep."
      - "Had enough for now? Fair. Stepping away costs nothing."
      - "Leaving partway through is allowed, encouraged even. Nothing is lost."

  market.no_swap:
    ai: never
    when: "No stall swap passes the player's rules for an item that's out of stock (Ruling 11): skip it this week."
    vars:
      item: "the missing item"
    lines:
      - "No swap for {item} passes your rules, so I won't offer one. Skip it this week."
      - "There's no stand-in for {item} that I can check against your rules. Leave it off this week."
      - "Nothing I can check against your rules takes the place of {item}. This week, the dish goes without it."
      - "No checked substitute for {item}. Skip it this week; the rest of the dish still stands."

  market.stock_swapped:
    ai: never
    when: "Read-back after the player takes a stall swap: labelled on the recipe and re-checked against their rules (Ruling 11)."
    vars:
      item: "the missing item"
      swap: "the stall swap"
      dish: "the dish it serves"
    lines:
      - "Swapped: {swap} for {item} in {dish}. It's labelled on the recipe and checked against your rules."
      - "{swap} instead of {item}, for {dish}. Labelled as a stall swap, and checked against your rules."
      - "Done: {dish} gets {swap} in place of {item} this week. Labelled, and checked against your rules."
      - "{item} out, {swap} in, for {dish}. The swap is labelled on the recipe and checked against your rules."

  season.now:
    ai: never
    when: "The Season's Table note beside an item in season where the player is (Ruling 10). Information only; only on an item the rules engine calls ✅."
    vars:
      item: "the item"
    lines:
      - "{item}: in season where you are."
      - "In season where you are: {item}."
      - "{item} is in season near you right now."
      - "{item}, in season here, now."

  season.other:
    ai: never
    when: "A neutral note for the region's other categories (\"stored\", \"well-travelled\", \"depends\"). Never a warning, never a judgement (Ruling 10)."
    vars:
      item: "the item"
      category: "the region's category label, e.g. 'Well-travelled: shipped in from far away'"
    lines:
      # REVIEW: M6 Step 5: was "{item}: {category}.", which as a pattern matches nearly any "X: Y." line, so the in-page
      # never-rules sweep could not tell a stall's storage tip from it. Same meaning, one word more. Content review.
      - "{item} here: {category}."
      - "For {item} this month: {category}."
      - "A note on {item}: {category}. Good to know, nothing more."
      - "{item}, this month, here: {category}."

  market.checkoff_readback:
    ai: never
    when: "Read-back of a check-off card (Step 8): what was got and what the stalls were out of."
    vars:
      summary: "what the card ticks or marks missing, e.g. 'got shallots; out of curry leaves'"
    lines:
      - "Reading it back: {summary}."
      - "Here's what I heard: {summary}."
      - "On the market list: {summary}."
      - "{summary}. The card is right there if I misheard."

  market.checkoff_none:
    ai: never
    when: "Nothing the player said matched a row of the open market list; nothing is ticked."
    lines:
      - "I couldn't match that to anything on the open list, so nothing's ticked."
      - "Nothing you said matches the list, so I haven't ticked anything. The rows are there to tap."
      - "That doesn't match any item on this week's list. Nothing ticked."
      - "No match on the list, so nothing's changed. Tap a row if you'd rather."

  market.no_run:
    ai: never
    when: "A check-off with no open market run: points at the list chip."
    lines:
      - "There's no market list open right now. The chip below takes you to it."
      - "No open market run to tick off. Tap the list chip to start one."
      - "Ticking needs an open market list, and there isn't one. The chip takes you there."
      - "Nothing to tick yet: no market list is open. Try the list chip."

  errand.question:
    ai: allowed
    when: "An errand's stall question, before it is asked. The errand step passes whatever is answered (spec §3.5)."
    vars:
      stall: "the stall keeper's name"
      item: "the errand's item"
    lines:
      - "{stall} has a question about {item} before you go. Any answer is fine; the errand's done either way."
      - "A quick one from {stall} about {item}. Right or wrong, the errand counts."
      - "Before the {item}: a question from {stall}. Nothing rides on it but the fun."
      - "{stall} wants to quiz you on {item}. Answer however you like; the errand's done."

  cook.drill_first:
    ai: never
    when: "Ruling 16: a recipe skill's prereqs aren't at Seen. The drill is offered; Cook stays enabled. Advisory only: no ❗, no \"should\", nothing in Family Table."
    vars:
      technique: "the technique's name"
      cook: "the cook whose drill it is"
    lines:
      - "This dish uses {technique}. {cook} has a short drill for it, if you'd like a practice first. Cooking now is fine too."
      - "A practice of {technique} with {cook} might make this one easier. Or cook it now; both are good."
      - "{technique} comes up in this dish. {cook}'s drill is there if you want it first. The Cook button works either way."
      - "If {technique} is new to you, {cook}'s drill is a gentle warm-up. Entirely optional; the dish is ready when you are."

  stamp_earned.market_game:
    ai: allowed
    when: "The weekly stall stamp, for a round played through (Ruling 1). Spends nothing (M5 Ruling 17); promises nothing."
    vars:
      stall: "the stall keeper's name"
    lines:
      - "A stall stamp from {stall}, for a round played through. It goes in your papers."
      - "Stamped: a round at {stall}. The ink is still wet. Don't blow on it."
      - "{stall} stamps your book. Played through is all it asks."
      - "A stamp for the round at {stall}. The Bureau has filed it with great ceremony."

  rescue.offer:
    ai: allowed
    when: Use-It-Up, as a rescue (audit M-4, M-14). At most one a day, only for food the player bought at the market, from a curated keep time. A gentle offer, never a countdown, never money.
    vars:
      item: "the bought item, e.g. 'spinach'"
      technique: "the technique the dish practises"
      dish: "the frame or dish that uses it, checked against the player's rules"
    notes: "Never comments on how much is in the cupboard. No numbers of days or hours. Compost is always an option."
    lines:
      - "The {item} from market day would make a good {dish}. It's {technique}, and quick. Shall we?"
      - "A thought for the {item}: {dish}. A little {technique}, a good ending, no waste."
      - "That {item} is ready for a second act. {dish} would suit it, and it's good {technique} practice."
      - "The {item} would like to be {dish}. I'm told it's keen. A bit of {technique} does it."
      - "If you're cooking soon, {dish} would use the {item} nicely. Good {technique} practice too."

  rescue.compost:
    ai: allowed
    when: The player composts a rescued item. Acknowledged warmly; never a loss, never money (audit M-14).
    vars:
      item: "the item"
    lines:
      - "Compost counts. The worms send their thanks."
      - "Into the compost with the {item}. It goes on to grow something. That's a good ending too."
      - "The {item} goes to the compost. Gardens are kitchens with patience."
      - "The {item} retires to the garden, with honours. The worms have been told."

  rescue.unverified:
    ai: never
    when: The rescue's frame or dish is ❓ for the player's rules. It is still offered, beside "Cook the frame", with the ❓ badge (Ruling 3 of fix round 1).
    vars:
      item: "the item"
    notes: "Plain and honest beside a Cook button: says what can't be checked and what to do. No guarantee, no joke. Compost is always an option."
    lines:
      - "I can't check a dish for the {item} against your rules. Check the label before you cook."
      - "There's a frame that would use the {item}, but I can't check all of it against your rules. Check every label before you cook it."
      - "I can't verify the {item}'s frame for your rules, so it shows ❓. If you cook it, read the labels first; the compost is fine too."
      - "The {item} could go in this frame, but I can't check it against your rules. Read the labels before you cook, or compost the {item}."

  week.move_partial:
    ai: never
    when: "The player tapped 'Move this week to your account?' and the plan reached the account, but the ticked market items or the finished shop didn't all follow (Task 10 fix round 2, N2). Nothing was removed from the device; a second tap carries on."
    notes: "Plain and truthful: says what moved and what didn't. No joke, no blame."
    lines:
      - "Your plan is with your account now, but the ticked items didn't all follow. Everything is still on this device too; tap Move it again to finish."
      - "The plan moved to your account. Some of the market list didn't, so this device keeps its copy for now. Tap Move it again to send the rest."
      - "Half there: the plan is on your account, the ticks aren't all. Nothing has left this device; tap Move it again when you're ready."
      - "Your account has the plan. The shopping ticks didn't all go through, so I've kept everything here as well. Try Move it again."

  frame.offer:
    ai: allowed
    when: A Pantry Frame filled from what's in the cupboard. Never comments on how much is there (audit M-4).
    vars:
      frame: "the frame's title, e.g. 'Green sauce'"
      technique: "the technique it practises"
    lines:
      - "From what's in the cupboard: {frame}. It's {technique}, built from your shelves."
      - "Your cupboard makes a {frame}. A good bit of {technique}, and dinner."
      - "{frame}, from things you already have. {technique}, start to finish."
      - "There's a {frame} in your cupboard waiting to happen. A {technique} lesson with a dinner attached."

  frame.slot_empty:
    ai: never
    when: A required frame slot has no filler that passes the player's rules; it stays unfilled and the frame shows ❓, never a guess.
    vars:
      slot: "the slot's name, e.g. 'rice'"
    notes: "Plain. About the slot, never about the cupboard."
    lines:
      - "I can't fill the {slot} with anything that passes your rules, so it stays unfilled. I won't guess. Pick something you've checked, or choose another frame."
      - "No {slot} I can verify for your rules. That part stays open, and the dish shows ❓ until it's filled."
      - "The {slot} needs something that passes your rules, and I can't verify anything for it. It stays unfilled; I won't guess."
      - "Nothing I can verify fits the {slot} under your rules, so I haven't filled it. The dish shows ❓ until you pick something I can check."

  cook.who_ate:
    ai: allowed
    when: After cook mode, Cooked for Someone asks "Who ate with you?" Skippable; no names are kept (Ruling 10).
    lines:
      - "Who ate with you? You can skip this; it's for your book and nobody else's."
      - "Before you wash up: who ate? Yourself, or company? Skip it if you'd rather."
      - "Who was at the table? Optional. The Bureau counts plates, never people."
      - "Did anyone eat with you? Tap to skip; it changes nothing."

  cooked_for.alone:
    ai: allowed
    when: The player answered "just me". Equal warmth to cooking for others (audit M-9); never a comparison.
    lines:
      - "Feeding yourself counts. It's the first person on the list."
      - "A table for one is still a table. Well fed is well fed."
      - "You cooked for you. That's the person I worry about most."
      - "Dinner for one, properly made. That's what the kitchen is for."

  cooked_for.shared:
    ai: allowed
    when: The player fed others. Never compared with anyone, never a requirement for anything.
    lines:
      - "You fed people. That's the oldest kindness there is."
      - "A full table. The cooks would be pleased; that's why they teach."
      - "Cooked for company. Every recipe on this map started that way."
      - "Someone ate well tonight because of you. That's a good evening's work."

  cook.changes_ask:
    ai: allowed
    when: After cook mode, "Did you change anything?" opens a margin note. Skippable; account-only (Ruling 9).
    lines:
      - "Did you change anything? A swap, a pinch more of something? Skip it if not."
      - "Anything you'd do differently next time? It goes in your margin, for you alone."
      - "Change anything? Margin notes are for your book, never the cook's page."
      - "Any notes for next time? Tap to skip; the recipe stays as the cook wrote it."

  margin.readback:
    ai: never
    when: Read-back of a margin-note card (Form 2-M/MARGIN), built by code; nothing is kept until the player taps.
    vars:
      summary: "the note as code read it, e.g. 'used oat milk instead of milk'"
    notes: "Plain. Never says the note is kept before the tap. The canon text is never altered (audit M-5)."
    lines:
      - "In the margin: {summary}. Shall I write it in?"
      - "Reading it back: {summary}. The cook's recipe stays as it is. Shall I add the note?"
      - "{summary}. That goes in your margin, not the recipe. Is that right?"
      - "So the note says: {summary}. The recipe itself won't change. Shall I add it to your margin?"

  margin.blocked:
    ai: never
    when: A margin note's swap or addition clashes with the player's rules. The note can still be kept, but while it clashes "Cook with my notes" stays off for the whole dish (Task 11 fix I4).
    vars:
      finding: "the engine's finding, e.g. 'peanut butter contains peanut'"
    notes: "Plain and true (voice §0.8). Says what happens: the note is kept if the player writes it in, and 'Cook with my notes' stays off for this dish while it clashes; the cook's recipe is still there. No joke touches an allergen line. # REVIEW: reworded in Task 11 fix round 1, for content review."
    lines:
      - "That change clashes with your rules: {finding}. If you keep this note, 'Cook with my notes' stays off for this dish while it clashes. The recipe as the cook wrote it is still there."
      - "{finding}. That's against your rules. You can keep the note, but 'Cook with my notes' stays off for this dish until it no longer clashes."
      - "Your rules say no to that: {finding}. Keep the note if you like; 'Cook with my notes' stays off for this dish while it's there. The cook's recipe is unchanged."
      - "I can't cook that change with your rules: {finding}. If the note is kept, 'Cook with my notes' stays off for this dish. You can still cook the recipe as the cook wrote it."

  margin.needs_account:
    ai: never
    when: A signed-out player tries to keep a margin note; notes are account-only (Ruling 9).
    lines:
      - "Margin notes live with your account, so they're kept private. Sign in from Settings, and the margin is yours."
      - "I can keep margin notes once you're signed in. Settings has the sign-in. The recipe works as it is meanwhile."
      - "Notes need an account, so they sit with your other private things. Sign in from Settings whenever you like."
      - "To keep a margin note I need you signed in; Settings has the sign-in. Nothing about the recipe changes meanwhile."

  log.dish_offer:
    ai: never
    when: The one-tap log card after cooking a dish (spec §5); skippable. Signed-out players get log.needs_account instead.
    vars:
      dish: "the dish cooked"
    lines:
      - "Log {dish} as a meal? One tap, or skip it."
      - "{dish}: shall I put it in the food log? Tap to log, or skip."
      - "Want {dish} in your food log? It's one tap. Skipping is fine too."
      - "Shall I log {dish}? One tap does it, and skipping costs nothing."

  quest.recognize:
    ai: allowed
    when: A quest's recognize step, when the player has its technique at Tried from another cook's dish (audit M-3). The generic line until M10's cook lines; nothing is said otherwise.
    vars:
      technique: "the technique, e.g. 'Tempering'"
      cook: "the cook whose kitchen this is"
    notes: "Recognition, never comparison: no cuisine is a 'version of' another. Credit the other kitchen, warmly."
    lines:
      - "{cook} has noticed how you handle the {technique}. Someone taught you well, and {cook} can tell."
      - "Your hands already know {technique}. {cook} sees it straight away. Good teachers recognise good teaching."
      - "{cook} nods at your {technique}. Learned in another kitchen, and welcome in this one."
      - "{technique}: you've done this before, and {cook} can see it. Kitchens talk to each other through your hands."
      - "{cook} spots the {technique} at once. Different kitchen, same care."

  quest.travel_anyway:
    ai: allowed
    when: The player visits a cook who hasn't had an introduction yet; every launch cook is visitable anyway (Ruling 3).
    vars:
      cook: "the cook"
    lines:
      - "{cook} hasn't had a letter about you yet, but the door's open. Guests are welcome; introductions come later."
      - "No introduction yet for {cook}. That's fine. Knock politely, wash your hands, and listen."
      - "We can visit {cook} now. An introduction would be nice, but a polite guest is always let in."
      - "{cook} is expecting nobody in particular, which means anybody polite. Off we go."

  certificate.technique:
    ai: allowed
    when: A technique reaches "Yours" and the Bureau issues Form 51-T, the Certificate of Technique (audit M-1).
    vars:
      technique: "the technique"
    lines:
      - "{technique} is yours now. The Bureau has issued Form 51-T, the Certificate of Technique. Your hands knew first."
      - "Certificate of Technique: {technique}. Yours, for keeps. Nobody can take it back, least of all the Bureau."
      - "{technique}, certified yours. You cooked your way there. That's the only way there is."
      - "The Bureau certifies {technique} as yours. I certify that I saw it happen."

  book.empty:
    ai: allowed
    when: The Recipe Book before any dish has been taught.
    lines:
      - "The Recipe Book is waiting for its first page. A cook will write it with you."
      - "Nothing in the book yet. The first page comes when a cook teaches you a dish."
      - "A fresh book. The Bureau considers that one of life's great pleasures. Visit a cook to start it."
      - "The book's ready. The pages fill as the cooks teach you."

  book.exported:
    ai: never
    when: The Recipe Book file was saved to the player's device. It's theirs, and export is always free (spec §16).
    lines:
      - "Your Recipe Book is saved to your device. It's yours, always free."
      - "Saved: the Recipe Book file. It's yours to keep, always free."
      - "The book is saved as a file on your device. Yours, always, and it never costs a thing."
      - "Your Recipe Book file is on your device now. It's yours to keep, and exporting it is always free."

  nav.offer:
    ai: never
    when: The line beside a navigation chip (Ruling 15). Nothing moves until the player taps the chip.
    vars:
      place: "the place's name, e.g. 'the market list'"
    lines:
      - "Tap to go to {place}."
      - "{place} is a tap away."
      - "Shall we go to {place}? Tap when you're ready."
      - "When you're ready, tap to go to {place}."

  # ------------------------------------------------------------------
  # Meta: undo, confusion, AI down, progression
  # ------------------------------------------------------------------

  undo:
    ai: allowed
    when: The player says or taps undo within the undo window.
    lines:
      - "Undone. I've crossed it out. The Bureau will want to know why. The Bureau will not be told."
      - "Gone. As if it never happened, except I remember. I remember everything. I'm 140."
      - "Struck from the ledger. Neatly. I have standards."
      - "Un-done. Un-logged. Un-filed. The filing cabinet is disappointed but it'll cope."
      - "Reversed. If it was a mistake, no harm. If you change your mind again, I'll keep up."
      - "Undone. Form 0-U, Retraction of Enthusiasm, filed on your behalf."

  undo.nothing:
    ai: allowed
    when: The player says undo but there's nothing to undo.
    lines:
      - "Nothing to undo. The ledger is pristine. It's unsettling."
      - "There's nothing to take back. You've been flawless. Or quiet. Either way."
      - "Nothing to undo. I checked. I'm thorough. I'm a pan."
      - "Nothing to undo. You've made no mistakes. Suspicious, but congratulations."

  card.rejected:
    ai: never
    when: The player turns down a meal, profile or pantry card ('Not quite', or a typed "no" for one card); nothing was saved. Rule cards use rule.not_quite.
    lines:
      - "Crossed out. Nothing's been filed. Tell me again in your own words if you'd like a fresh card."
      - "No harm done; nothing was saved. Tell me what to change and I'll write a new card."
      - "Struck out, unfiled. Say it again your way and I'll read it back."

  didnt_understand:
    ai: allowed
    when: The Pan can't map what the player said to a tool or FAQ (and the AI is unavailable or also unsure).
    lines:
      - "I'm a pan. I understood about a third of that, and the third was 'the'. I can log a meal, save an allergy or diet rule, plan your week, update your pantry, set your market day, or answer a cooking question."
      - "A hundred and forty years seasoned and that's still a new one. Ask me about what you ate, what you can't eat, your market day, your week, or knives."
      - "The Bureau has no form for that. It's drafting one; expect it in eleven to fourteen working centuries. Meanwhile: tell me what you ate, what's in the cupboard, or what you'd like to cook."
      - "I didn't catch that. Try 'I had toast for breakfast', 'I'm allergic to sesame', 'plan my week', or 'what can I make with rice?'"
      - "Lost me there. I'm good with food, schedules, rules and rice. Pick one and we'll go from there."
      - "Hmm. Say it another way? Or tap one of the buttons below; they're Bureau-approved phrasings."

  ai_unavailable:
    ai: never
    when: The AI provider is down, rate-limited or returned invalid output; the game falls back to scripted lines.
    lines:
      - "The line to the Bureau's gone quiet. I'll answer from the script for now. Logging, planning, recipes and allergy checks all still work."
      - "The Pan needs a moment. Even cast iron has to cool down. I've kept what you said; try again shortly."
      - "My clever half has stepped out. My sensible half is still here. I can log meals, show recipes, check allergies and run the market. The free-form chat will be back soon."
      - "The cook has stepped out; your plate is on the pass and they'll get to it. Your photo's saved, and the reaction will arrive when they're back."
      - "I'm on the backup script. It's a good script. I wrote most of it, in 1923, on a very long train."

  rate_limited:
    ai: never
    when: The player has hit the daily free-form message limit.
    lines:
      - "I've talked a great deal today and the Bureau has rationed my words. Recipes, logging, the market and your rules all still work. Free-form chat is back tomorrow."
      - "That's my chatting allowance for today. Everything else still works. Ask me again tomorrow and I'll be insufferable."
      - "The Bureau has counted my words for today and says I've used them all. I disagree. I'll be quiet anyway. Logging, recipes, the market and rule checks all still work."
      - "I've hit today's chat limit. Everything else in the kitchen still works. I'll be back to full volume tomorrow."

  thanks:
    ai: allowed
    when: The player thanks the Pan.
    lines:
      - "Don't mention it. Really. The Bureau charges a gratitude levy."
      - "You're welcome. I'm a pan. Being useful is the whole of my personality."
      - "Any time. Literally any time. I don't sleep."
      - "Thank you for thanking me. Nobody thanks the pan. They thank the cook. Which is fair, but still."

  levelup:
    ai: allowed
    when: The player's apprentice level increases.
    vars:
      level: "the new apprentice level number"
    lines:
      - "Apprentice level {level}. The Bureau has issued a certificate. It confers no rights, titles or kitchens. It does confer the right to make dinner."
      - "Level {level}. You've earned it the honest way: by cooking things and eating them."
      - "Level {level}. I've known cooks who took years to get here. I've known pans who never did."
      - "Level {level}, apprentice. Still an apprentice. Everyone is. Leela says she's still learning, and she's been at it sixty years."
      - "Level {level}. I'd throw you a party, but I'd have to be the party, and I'd scorch the table."
      - "Up a level: {level}. You're cooking more, and better. That's the only measure that counts."

  stamp_earned:
    ai: allowed
    when: A Bureau Stamp is awarded.
    vars:
      stamp: "the stamp's name, e.g. 'Seasonal Sorting'"
    lines:
      - "A stamp! The Bureau will be insufferable about this."
      - "Stamp earned: {stamp}. It goes in the book with the others. The book is getting heavy. Good."
      - "{stamp}, stamped. The ink is still wet. Don't blow on it; the Bureau considers that tampering."
      - "Another stamp. Your book is filling up. The Bureau is filling up with pride. It's mostly filing."
      - "Stamped: {stamp}. That's a real skill you'll use in a real shop. The stamp is just the receipt."

  skill_up:
    ai: allowed
    when: "A technique moves up a tier (Seen → Tried, Tried → Yours)."
    vars:
      technique: "the technique's name, e.g. 'Heat control'"
    notes: "Techniques have tiers, not levels (Ruling 4). Never 'level' here."
    lines:
      - "{technique} is improving. Your hands know more than they did last week."
      - "{technique}, a tier further along. Skills are mistakes you've stopped making."
      - "Better at {technique}. I can tell. I can always tell."
      - "{technique}: better. Your hands are learning faster than you think."

  trust_up:
    ai: allowed
    when: Trust with a cook increases.
    vars:
      cook: "the cook"
    lines:
      - "{cook} trusts you a little more. That's worth more than stamps."
      - "You've earned some of {cook}'s trust. Look after it. It's harder to season than iron."
      - "{cook} smiled when you left. I saw. I see everything."
      - "{cook} trusts you more now. Earned the slow way, which is the only way that sticks."

  introduction_received:
    ai: allowed
    when: "A cook introduces the player to a friend; the friend's pin changes to 'expecting you'."
    vars:
      cook: "the introducing cook"
      friend: "the cook being introduced"
      place: "the friend's place"
    lines:
      - "{cook} has written to {friend} in {place}. That's an introduction. They don't hand those out; they give them."
      - "{friend}, in {place}, is expecting you now, because {cook} vouched for you. Don't make {cook} regret it."
      - "{friend}, in {place}. An introduction from {cook}. In the Bureau's hierarchy of documents, this outranks a stamp."
      - "A letter of introduction: {cook} to {friend}, {place}. {friend} is expecting you now. Arrive hungry and polite."

  # ------------------------------------------------------------------
  # Mentor conversation (Milestone 4). Fired by code, never written by the model.
  # All ai: never: they guard writes, consent and the AI fallback.
  # ------------------------------------------------------------------

  confirm.tap_card:
    ai: never
    when: The player typed "yes" or "no" while more than one card is open; nothing is confirmed or turned down.
    lines:
      - "There's more than one card open. Tap the one you mean, so I'm sure which."
      - "I've more than one card open, and I'd rather not act on the wrong one. Tap the card you mean."
      - "Several cards, one answer. Tap the card you mean and I'll go from there."

  write.not_done:
    ai: never
    when: The player asked for a record to change (profile, pantry, rules, meals) and no card came out; the model's text is never shown (Step 7 ruling R9).
    notes: "The on-screen card is the record (spec §7.6b.3). Never implies anything is on file."
    lines:
      - "Nothing's been written down yet. If you'd like me to, tell me plainly and I'll show you the card to stamp."
      - "To be clear: nothing's been written down. If you'd like me to file something, say so plainly and I'll show you the card."
      - "I haven't written anything down yet. Only a card you've stamped is on file. Tell me what to file and I'll show you a card to stamp."

  write.daily_limit:
    ai: never
    when: A typed yes would log a meal or loosen a rule past the daily write limit (200 a day, M4 Step 12); nothing was written.
    notes: "Plain. Never says rules stop working: adding, removing or tightening a rule is never limited."
    lines:
      - "That's a great many changes for one day, so the Bureau has paused new entries until tomorrow. Nothing new was written. Your rules still work, and you can still add or remove one."
      - "The ledger takes a breather after this many entries in a day. Nothing new was written down. Your rules still work, and adding or removing one is never limited."

  consent.health_first:
    ai: never
    when: A rule or meal card would be shown to a player without health_data consent; the consent card (Form 3-C/HEALTH) is shown instead.
    lines:
      - "Before I can file that, the Bureau needs your say-so to keep health details. Tap the card, then tell me again."
      - "I can't file that until you've said the Bureau may keep health details. Nothing's been filed. Tap the card if you agree, then tell me again."
      - "Health details need your permission first. Nothing's been filed yet. Tap the card if you're happy to give it, then tell me again."

  child.grownup:
    ai: never
    when: The player appears to be a child. Exactly one fixed line, no joke; nothing they said is kept.
    lines:
      - "I'm glad you're cooking. I can only take notes from a grown-up, so please fetch the grown-up you cook with. And use the big knives only with them right beside you."

  allowance.explain:
    ai: never
    when: Any question about paying, limits or keeping on talking. Always this scripted line, never a model reply.
    notes: "Never rule 7: never sells, and never names a paid membership, a cost or a level of one. Honest about the daily cap. Rule help and logging are never capped (pre-flight C6)."
    lines:
      - "I've a daily allowance of chat, and I'll tell you when it runs out. Recipes, cooking, allergy and diet rules, logging and the market always work, every day, for nothing."
      - "There's a daily limit on how much I can chat freely, and I'll say when it's used up. Help with allergy and diet rules is never limited. Recipes, cooking, logging and the market always work, every day, for nothing."
      - "I get a daily allowance of chat. The Bureau counts my words; I'd talk all day if it didn't. Help with allergy and diet rules is never limited, and recipes, cooking, logging and the market always work, every day, for nothing."

  log.needs_account:
    ai: never
    when: The player describes a meal while signed out. Meal logs are account-only in M4.
    lines:
      - "I can keep a food log once you're signed in. Settings has the sign-in. Everything else works on this device as it is."
      - "Nothing's been logged; the food log needs you signed in first. Settings has the sign-in. Everything else works on this device as it is."
      - "Meal logs live with your account, so I'll need you signed in before I keep one. The sign-in is in Settings. Everything else works here without it."

  profile.readback:
    ai: never
    when: Read-back of a profile or schedule card (Form 1-A/AMEND or 6-R) before it's inked.
    vars:
      summary: "the code-built read-back, e.g. 'market day Saturday, about five meals a week'"
    lines:
      - "{summary}. Shall I ink it?"
      - "Reading it back: {summary}. Ink it?"
      - "I heard: {summary}. Is that right?"
      - "Let me check I've got it: {summary}. Shall I ink it, or leave it in pencil?"

  pantry.readback:
    ai: never
    when: Read-back of a pantry card (Form 4-P) before it's stamped.
    vars:
      summary: "the code-built read-back, e.g. 'add rice and two onions; take out the milk'"
    lines:
      - "{summary}. Shall I update the pantry?"
      - "Reading it back: {summary}. Update the pantry?"
      - "I heard: {summary}. Is that right?"
      - "Let me check I've got it: {summary}. Shall I update the pantry?"

  ai.try_again:
    ai: never
    when: The AI failed on a turn; the player's message is held in memory for the 'Try again' button.
    lines:
      - "I've kept what you said. Tap 'Try again' in a moment, or use the buttons below."
      - "That didn't go through. Your message is still here; tap 'Try again' shortly, or use the buttons below."
      - "Something went wrong at the Bureau's end. I've held on to your words. Tap 'Try again' in a moment, or pick a button below."

  mentor.ai_unavailable:
    ai: never
    when: The mentor's AI failed or is off for this turn; the scripted engine answers. Used by the mentor instead of ai_unavailable.
    notes: "Never claims anything was saved, kept or logged, and never mentions photos (pre-flight C33)."
    lines:
      - "The line to the Bureau's gone quiet, so I'm answering from the script. Allergies, logging, recipes and the market all still work."
      - "My clever half has stepped out, so you're getting the script. It's a good script. Allergy and diet rules, logging, recipes and the market all still work."
      - "I'm on the written script for now. Allergy and diet rules, logging, recipes and the market all work as normal. Free-form chat comes back when the line does."

  forget.done:
    ai: never
    when: The player cleared their conversations.
    lines:
      - "Forgotten. The conversation's gone from the Bureau's files. Your saved rules, meals and pantry are where you left them."
      - "For once in 140 years, I've forgotten something. The conversation's gone from the Bureau's files. Your saved rules, meals and pantry are untouched."
      - "Cleared. The conversation's gone. Your saved rules, meals and pantry stay exactly where they were."

  # ------------------------------------------------------------------
  # Game shell (Milestone 3)
  # ------------------------------------------------------------------

  # ------------------------------------------------------------------
  # Live voice (Milestone 7). Every voice.* line is written, never the model's (`ai: never`), and plain on safety
  # (voice §0.8). Step 5: the lines the API's voice route speaks itself (Ruling 15); Step 6: the rest.
  # ------------------------------------------------------------------
  # REVIEW: voice.check_screen is the fallback for anything the Pan won't say aloud; it must stay var-free (cacheable).
  voice.check_screen:
    ai: never
    when: A spoken item could not be said safely aloud (too long, a variable that failed the filter, or a line with variables the device holds). The screen has it.
    lines:
      - "It's on the screen; read it there."
      - "That one's on the screen. Have a look there."

  # REVIEW: a canon step is read aloud only when the dish is ✅ with no swap (Ruling 11); otherwise this. Neutral on
  # purpose (Step 5 fix round 1, m6): it is also said for a ⛔ or ❓ dish and a margin note, so it names no reason.
  voice.step_on_screen:
    ai: never
    when: Cook mode asked for a step to be read, but the step is shown, not spoken (a swap, a rule finding, a margin note, or not cleared today).
    lines:
      - "This step's on the screen. Read it there."
      - "Read this step on the screen, please. I'd rather you saw it."

  # REVIEW: the heard card's spoken half. The words are as heard, never corrected; only a tap confirms them (Ruling 4).
  voice.heard_check:
    ai: never
    when: The Pan heard food or rule words in a transcript and shows the heard card; no health wording, so no spelling.
    vars:
      terms: "the words as heard, e.g. 'rice and kiwi'"
    lines:
      - "I heard {terms}. Tap the card if that's right."
      - "I think you said {terms}. Check the card and tap it if I got it right."

  # REVIEW: spelled letter by letter from code (§7.6b.2), because mishearing an allergen is the worst failure mode.
  voice.heard_check_spelled:
    ai: never
    when: As voice.heard_check, with health wording present, so the heard words are spelled out too.
    vars:
      terms: "the words as heard, e.g. 'sesame'"
      spelled: "the same words spelled by code, e.g. 'S-E-S-A-M-E'"
    lines:
      - "I heard {terms}: {spelled}. Tap the card if that's right."
      - "I think you said {terms}. That's {spelled}. Tap the card if I got it right."

  voice.too_long:
    ai: never
    when: An utterance ran past the time limit, or its transcript is too long to check. Nothing was acted on.
    lines:
      - "That was too long for me to take in at once. Type it instead, or say it in shorter pieces."
      - "I lost the thread there; it ran long. The text box will take the whole thing."

  # REVIEW: the heard card's "Say it again" button. Nothing was kept of what was heard; the player just speaks again.
  voice.heard_retry:
    ai: never
    when: The player tapped "Say it again" on the heard card. Nothing of the misheard words was kept or acted on.
    lines:
      - "Go on, say it again. I'm listening."
      - "Right, once more. Nothing's been written down."
      - "Say it again, a little slower if you can. I'll show you what I hear."

  # REVIEW: the scripted filler while a turn runs (§7.6b.8). Var-free, so cacheable; it never says what the turn does.
  voice.filler.thinking:
    ai: never
    when: Said while a spoken turn is still being answered (no write in its shape). Var-free and cacheable.
    lines:
      - "Hmm, let me think."
      - "One moment."
      - "Just a moment, I'm thinking."

  # REVIEW: the spec's own filler (§7.6b.8). Var-free, so cacheable. Nothing is written until the player taps the card.
  voice.filler.ledger:
    ai: never
    when: Said while a spoken turn shaped like a write (a meal, a pantry change, a rule, a check-off) is still being answered. Var-free and cacheable.
    lines:
      - "Let me write that in the ledger…"
      - "One moment, I'm getting the ledger out…"
      - "Let me find the right page in the ledger…"

  # REVIEW: the allowance is a state, never a number (Ruling 5): no count, countdown or timer, no Guild, no upsell.
  voice.resting:
    ai: never
    when: The player's free voice is resting until a later day (Ruling 5). Typing works as always. Names no number, countdown or plan.
    vars:
      until: "the day voice is back, e.g. 'Thursday 19 November'"
    lines:
      - "My voice is resting until {until}. Type to me in the meantime; everything else works."
      - "I'm resting my voice until {until}. The text box works just the same."

  # REVIEW: as voice.resting, for a rest that lifts later the same day (Ruling 5, B4). No hour, no countdown.
  voice.resting_today:
    ai: never
    when: The player's free voice is resting for the rest of today (Ruling 5). Typing works as always.
    lines:
      - "My voice is resting for today. Type to me instead; everything else works."
      - "I'm resting my voice for the rest of today. The text box works just the same."

  # REVIEW: the voice service is down or slow (Review Focus 5). Plain, and the text box is named.
  voice.unavailable:
    ai: never
    when: Voice can't be used right now (the voice service is down or slow, or the line dropped). Nothing was kept; the text box works.
    lines:
      - "I can't hear you right now. Type to me instead; the text box works."
      - "Voice isn't working at the moment. Please type, and I'll answer as usual."
      - "The line's gone quiet on my end. Type to me for now."

  # REVIEW: voice needs the player's own say-so by tap (the voice consent card); never asked for by speech.
  voice.consent_needed:
    ai: never
    when: The player tried to talk but hasn't turned on voice (the voice consent). The consent card is shown; nothing was heard.
    lines:
      - "Before I can listen, I need your say-so. Tap the card to turn on voice, or type to me instead."
      - "Voice is off until you turn it on. Tap the card if you'd like to talk; typing works either way."

  # REVIEW: an utterance that came back empty. Nothing was acted on.
  voice.didnt_catch:
    ai: never
    when: The player spoke but nothing came through (an empty transcript). Nothing was acted on.
    lines:
      - "I didn't catch that. Say it again, or type it."
      - "Sorry, nothing came through. Try again, or use the text box."
      - "That one slipped past me. Once more, or type it if that's easier."

  # REVIEW: fix round 1 (I-2): the server refused voice because Family Table is on for the account (Ruling 17), maybe
  # on another device. Plain; typing is named.
  voice.family_table:
    ai: never
    when: The server refused voice because Family Table mode is on for this account (on this or another device). The talk button is put away; typing works.
    lines:
      - "Voice is off while Family Table mode is on for your account. Type to me instead; everything else works."

  # REVIEW: fix round 3 (N-1): the browser refused the microphone. Says what to fix, plainly; typing is named.
  voice.mic_blocked:
    ai: never
    when: The browser did not let the game use the microphone (the permission was refused or no microphone was found). Nothing was heard.
    lines:
      - "Your browser didn't let me use the microphone. You can allow it in the browser's settings for this site, or type to me instead."

  # REVIEW: fix round 3 (N-2): the server refused voice because a child spoke in one of the account's conversations
  # (Ruling 17), maybe on another device. Neutral: it may well be read by the grown-up.
  voice.child_block:
    ai: never
    when: The server refused voice for a while because a child spoke in one of this account's conversations (on this or another device). Typing works.
    lines:
      - "Voice is paused for a while on this account, because a child was talking to me. Type to me instead; everything else works."

  # REVIEW: hands-free is cook mode only, off by default (Ruling 7). Tapping talk always stops the Pan.
  voice.hands_free_on:
    ai: never
    when: The player turned on hands-free in cook mode (Ruling 7). The Pan listens without the talk button.
    lines:
      - "Hands-free is on. Talk to me while you cook; tap the talk button to stop me."
      - "I'm listening hands-free now. Say \"next step\" when you're ready."

  # REVIEW: hands-free off. Hold-to-talk and the text box still work.
  voice.hands_free_off:
    ai: never
    when: Hands-free was turned off (by the player, on leaving cook mode, or on hiding the page). Hold-to-talk still works.
    lines:
      - "Hands-free is off. Hold the talk button when you want me."
      - "I've stopped listening. Hold to talk, or type, whenever you need me."

  # REVIEW: hands-free turned itself off after a quiet spell (HANDS_FREE_IDLE_MS). No duration is named.
  voice.hands_free_idle:
    ai: never
    when: Hands-free turned itself off after a quiet spell in cook mode (Ruling 7). No duration is named.
    lines:
      - "It's gone quiet, so I've stopped listening. Hold to talk when you need me."
      - "I've turned hands-free off for now. Hold the talk button to wake me."

  # REVIEW: hands-free cook mode's own spoken cues (M7 Step 10 fix round 1). Var-free, so the API can say them (Ruling
  # 15); they ship in the lazy cook-voice module, not first paint. A spoken stop never stops a running timer (I3), and
  # a spoken "next" never finishes the dish (I4): finishing and any choice between timers are a tap.
  voice.cook.timer_started:
    ai: never
    when: Hands-free, the player said "start the timer" and this step's timer started. It shows in the timer tray.
    lines:
      - "Timer started. It's in the tray on the screen."

  voice.cook.no_timer:
    ai: never
    when: Hands-free, the player said "start the timer" but this step has no timer that isn't already running.
    lines:
      - "There's no timer to start on this step."

  voice.cook.timer_stopped:
    ai: never
    when: Hands-free, the player said "stop the timer" and the one timer that had just gone off was cleared. A running timer is never stopped by voice.
    lines:
      - "Stopped the timer that just went off. Any others are still running."

  voice.cook.timer_which:
    ai: never
    when: Hands-free, the player said "stop the timer" but no timer had just gone off, or more than one had. Nothing was stopped.
    lines:
      - "Which timer? Tap it to stop it."

  # REVIEW: fix round 2 (controller ruling): in hands-free a spoken yes confirms nothing; a radio or another person in
  # the room must never confirm a card. Said once per card that waits for its tap.
  voice.cook.tap_card:
    ai: never
    when: Hands-free, a spoken yes (or "confirm", "that's right") while a card waits. It confirms nothing; the card needs a tap.
    lines:
      - "Tap the card to say yes."

  voice.cook.last_step:
    ai: never
    when: Hands-free, the player said "next" on the last step. Finishing the dish is a tap only, so nothing finished.
    lines:
      - "That's the last step. Tap Done when it's served."

  toolkit.rusty_invite:
    ai: allowed
    when: Shown beside a Rusty technique on the knife roll. An invitation, never a warning (spec §17).
    vars:
      technique: "the technique's name, e.g. 'Tempering'"
    notes: "No guilt, no urgency, no numbers. The technique is still the player's."
    lines:
      - "Your {technique}'s gone a bit rusty. Fancy a refresher?"
      - "{technique} hasn't been out of the drawer in a while. Still yours. A refresher, some evening?"
      - "{technique}: a little rusty, still yours. One dish would sharpen it right up."

  # ------------------------------------------------------------------
  # Screen copy (Your rules, Settings > The Pan): one line each, shown exactly as written.
  # ------------------------------------------------------------------

  ui.pan.held:
    ai: never
    when: "The Pan panel: the player pressed Send while the Pan is still answering; the message stays in the box (an emergency still goes at once)."
    lines:
      - "I'm still answering. Your message is kept in the box; send it again in a moment."

  ui.rules.bad_rule:
    ai: never
    when: "Your rules: a saved rule that no longer validates."
    lines:
      - "This rule names an ingredient the ledger doesn't know any more."

  ui.rules.unreadable_confirm:
    ai: never
    when: "Your rules: the button under the could-not-be-read banner."
    lines:
      - "These are all my rules"

  ui.rules.unreadable_empty:
    ai: never
    when: "Your rules: an empty list under the couldn't-be-read banner is never 'no rules'."
    lines:
      - "None of the rules on this device could be read back. Add each of your rules again below. If you have none, tap 'These are all my rules'."

  ui.rules.not_removed:
    ai: never
    when: "Your rules: a removal that failed."
    lines:
      - "That didn't go through, so nothing was removed. Try again in a moment."

  ui.rules.restored:
    ai: never
    when: "Your rules: after Undo of a removal."
    lines:
      - "Put back. Dishes are checked for it again."

  ui.rules.copy_warning:
    ai: never
    when: "Your rules: above device rules the account lacks."
    lines:
      - "These rules are saved on this device but not on your account. While you're signed in, dishes are checked against your account's rules only."

  ui.rules.raise_warning:
    ai: never
    when: "Your rules: above device rules stricter than the account's."
    lines:
      - "These rules are stricter on this device than on your account. While you're signed in, dishes are checked against your account's version."

  ui.rules.cant_copy:
    ai: never
    when: "Your rules: a device rule that cannot be built into a card."
    lines:
      - "This one can be copied by telling the Pan about it."

  ui.rules.consent_done:
    ai: never
    when: "Your rules: after the health-data permission is granted from a card."
    lines:
      - "Permission filed. Tap the stamp button again to save the rule."

  ui.rules.consent_unavailable:
    ai: never
    when: "Your rules: the permission form could not load."
    lines:
      - "The permission form couldn't load just now. Nothing has changed."

  ui.rules.consent_failed:
    ai: never
    when: "Your rules: granting the permission failed."
    lines:
      - "That didn't go through. Nothing has changed."

  ui.rules.nothing_saved:
    ai: never
    when: "Your rules: the player turned a card down."
    lines:
      - "Nothing was saved."

  ui.rules.confirmed_all:
    ai: never
    when: "Your rules: after 'These are all my rules'."
    lines:
      - "Thank you. Dishes are checked against these rules again."

  ui.rules.device_list_intro:
    ai: never
    when: "Your rules: above the device rules the banner button confirms (signed in)."
    lines:
      - "The button confirms the rules saved on this device:"

  ui.rules.device_list_empty:
    ai: never
    when: "Your rules: no device rule could be read back."
    lines:
      - "None could be read back."

  ui.rules.account_empty:
    ai: never
    when: "Your rules: signed in, none on the account."
    lines:
      - "Your account has no rules yet."

  ui.rules.device_empty:
    ai: never
    when: "Your rules: signed out, none on the device."
    lines:
      - "No rules are saved on this device yet."

  ui.rules.void_effect:
    ai: never
    when: "Your rules: the effect line on Form 27-B/VOID."
    lines:
      - "Dishes will no longer be checked for this."

  ui.rules.intro:
    ai: never
    when: "Your rules: under the heading."
    lines:
      - "The allergies, intolerances and diet rules dishes are checked against. Every rule is read back and stamped before it counts."

  ui.rules.add_intro:
    ai: never
    when: "Your rules: under 'Add a rule'."
    lines:
      - "Choose an ingredient or a diet rule, say how serious it is, and stamp the form."

  ui.rules.nothing_found:
    ai: never
    when: "Rule form: a search with no match."
    lines:
      - "The Bureau's ledger has nothing by that name. Try another word, or tell the Pan."

  ui.rules.search_hint:
    ai: never
    when: "Rule form: hint under the search box."
    lines:
      - "Type part of a name, then choose one from the list."

  ui.settings.offline:
    ai: never
    when: "Settings, The Pan: a call that failed."
    lines:
      - "Couldn't reach the Bureau. Nothing has changed. Try again in a moment."

  ui.settings.health_data.label:
    ai: never
    when: "Settings, The Pan: health_data checkbox label."
    lines:
      - "Let the Bureau keep my health details"

  ui.settings.health_data.on:
    ai: never
    when: "Settings, The Pan: health_data granted."
    lines:
      - "The Bureau keeps your allergies, diet rules and meals with your account. Untick the box to stop; you choose what happens to what is saved."

  ui.settings.health_data.off:
    ai: never
    when: "Settings, The Pan: health_data not granted."
    lines:
      - "The Bureau doesn't keep health details with your account. Rules you make are kept on this device only."

  ui.settings.stale:
    ai: never
    when: "Settings, The Pan: a permission whose notice changed."
    lines:
      - "The notice for this permission has changed, so it no longer counts. Tick the box to read the new one."

  ui.settings.permission_done:
    ai: never
    when: "Settings, The Pan: after a permission is granted."
    lines:
      - "Permission filed. Thank you."

  ui.settings.ai_health.label:
    ai: never
    when: "Settings, The Pan: ai_health checkbox label."
    lines:
      - "Let the AI see my allergies, rules and meals"

  ui.settings.ai_health.on:
    ai: never
    when: "Settings, The Pan: ai_health granted."
    lines:
      - "The AI can see your allergies, rules and meals. Untick the box to stop it; that takes effect at once."

  ui.settings.ai_health.off:
    ai: never
    when: "Settings, The Pan: ai_health not granted."
    lines:
      - "The AI doesn't see your allergies, rules or meals. Rule help and meal logging still work without it."

  ui.settings.ai_mentor_hint:
    ai: never
    when: "Settings, The Pan: under the 'Talk to the Pan's AI' box."
    lines:
      - "Off, the Pan answers from its written script. Rules, logging and recipes work either way."

  ui.settings.ai_withdrawn:
    ai: never
    when: "Settings, The Pan: after the AI permission is withdrawn."
    lines:
      - "Done. The AI no longer sees your allergies, rules or meals."

  ui.settings.health_deleted:
    ai: never
    when: "Settings, The Pan: after health details are deleted."
    lines:
      - "Done. Your health details have been deleted from your account."

  ui.settings.health_kept:
    ai: never
    when: "Settings, The Pan: after health_data is withdrawn, keeping what is saved."
    lines:
      - "Done. Nothing new is kept; what was saved stays, read-only."

  ui.settings.erase_body:
    ai: never
    when: "Settings, The Pan: the delete-health-details confirm."
    lines:
      - "This removes the allergies, diet rules, meals and conversations kept with your account. It can't be undone. Rules on this device are untouched."

  ui.settings.withdraw_body:
    ai: never
    when: "Settings, The Pan: the keep-or-delete choice when health_data is withdrawn."
    lines:
      - "Keep: your saved rules, meals and conversations stay, read-only, and nothing new is added. Delete: they are removed from your account now. Either way, rules on this device are untouched."

  ui.settings.forget_body:
    ai: never
    when: "Settings, The Pan: the forget-conversations confirm."
    lines:
      - "This deletes what you and the Pan have said to each other from the Bureau's files. Your saved rules, meals and pantry stay as they are."

  # Settings → Voice (M7 Step 9). Screen copy, not Pan turns. The allowance is a state, never a number (Ruling 5): no
  # count, countdown, meter or timer, no Guild, no upsell. These ship in the lazy Settings module, not first paint.
  ui.settings.voice.signed_out:
    ai: never
    when: "Settings, Voice: signed out (Ruling 8: voice needs an account)."
    lines:
      - "Voice needs an account. Sign in to talk to the Pan out loud; typing works either way."

  ui.settings.voice.on_hint:
    ai: never
    when: "Settings, Voice: under the 'Talk out loud' box."
    lines:
      - "Off until you turn it on. The Pan listens only while you hold the talk button. Typing always works."

  ui.settings.voice.read_hint:
    ai: never
    when: "Settings, Voice: under 'Read the Pan's replies aloud' (M7 Step 10 fix round 1, M7)."
    lines:
      - "This is about the Pan's replies. In hands-free cook mode, a step you ask for out loud is read either way."

  ui.settings.voice.off_withdraws:
    ai: never
    when: "Settings, Voice: under 'Talk out loud', said before the tap (fix round 1, I-1: unticking withdraws the permission)."
    lines:
      - "Turning it off also withdraws your voice permission, on every device you use. Turning it on again asks for it again."

  ui.settings.voice.withdrawn:
    ai: never
    when: "Settings, Voice: after 'Talk out loud' was turned off and the voice permission withdrawn."
    lines:
      - "Done. Voice is off and your voice permission is withdrawn."

  ui.settings.voice.withdraw_failed:
    ai: never
    when: "Settings, Voice: turning voice off could not reach the Bureau, so the permission still stands and the box is ticked again."
    lines:
      - "That didn't go through, so your voice permission still stands and voice is still on. Untick the box to try again."

  ui.settings.voice.accessibility_hint:
    ai: never
    when: "Settings, Voice: under 'I need voice to use Kitchen Quest' (C4: the fair-use ceiling is named)."
    lines:
      - "Voice for players who need it is never limited by plan, and needs no proof. A daily fair-use ceiling applies to everyone, so the service stays up for all."

  ui.settings.voice.accessibility_consent:
    ai: never
    when: "Settings, Voice: the accessibility need is a health detail, so Form 3-C is shown first (Ruling 6)."
    lines:
      - "Needing voice is a health detail, so the Bureau asks your permission to keep it."

  ui.settings.voice.ready:
    ai: never
    when: "Settings, Voice: the state line, voice available."
    lines:
      - "Voice is ready."

  ui.settings.voice.resting:
    ai: never
    when: "Settings, Voice: the state line, resting until a later day (Ruling 5). A day and date only, never a number of anything."
    vars:
      until: "the day voice is back, e.g. 'Thursday 19 November'"
    lines:
      - "Voice is resting until {until}."

  ui.settings.voice.resting_today:
    ai: never
    when: "Settings, Voice: the state line, resting for the rest of today (Ruling 5, B4). No hour, no countdown."
    lines:
      - "Voice is resting for today."

  ui.settings.voice.not_offered:
    ai: never
    when: "Settings, Voice: this server does not offer voice."
    lines:
      - "Voice isn't available here yet. Typing works as always."

  ui.settings.voice.credits:
    ai: never
    when: "Settings, Voice: above the list of voice credits."
    lines:
      - "The speech models the Pan uses, and their licences:"

  ui.rules.undo_failed:
    ai: never
    when: "Your rules: an Undo on a raised rule that could not be sent (offline)."
    lines:
      - "That didn't go through, so nothing was changed. Try Undo again in a moment."

  card.earlier_conversation:
    ai: never
    when: The player taps a card from an earlier conversation (the conversation was cleared or started again since). Nothing is written.
    notes: "Plain. Never implies anything is on file."
    lines:
      - "That card was from an earlier conversation, so nothing's been written down. Tell me again and I'll show you a fresh card to stamp."

  undo.rule_changed:
    ai: never
    when: The player taps Undo on a raised rule, but the rule has been changed since (another tab or device). Nothing is changed, so an undo never lowers a rule.
    lines:
      - "That rule has changed since you raised it, so I've left it as it is now. Check it on Your rules."

  rule.raise_not_stricter:
    ai: never
    when: The player taps a raise whose severity is not stricter than what the account now holds (it changed elsewhere). Nothing is written.
    lines:
      - "Your account already has that rule at the same level or stricter, so nothing was changed. Check Your rules."

  ui.rules.severity_default:
    ai: never
    when: "Rule form: under the severity box; says what level the card is made out at if the player chooses none."
    vars:
      severity: "the default level in words, e.g. 'a Severe allergy'"
    lines:
      - "If you leave this, it is filed as {severity}."

  ui.rules.chosen:
    ai: never
    when: "Rule form: the ingredient or diet rule the player picked."
    vars:
      name: "the ingredient or rule name"
    lines:
      - "Chosen: {name}"

  ui.rules.stamped_line:
    ai: never
    when: "Your rules: after a card is stamped on this screen."
    vars:
      summary: "the trail summary, e.g. 'coconut, an allergy'"
    lines:
      - "✔ Stamped: {summary}"

  rule.raise_gone:
    ai: never
    when: The player taps a raise, but the rule is no longer on the account the way it was (removed or replaced elsewhere). Nothing is written.
    lines:
      - "That rule isn't on your account the way it was any more, so nothing was changed. Check Your rules."
