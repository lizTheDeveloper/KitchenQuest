disclaimers:
  allergy: "Kitchen Quest can't guarantee a dish is safe for your allergy. Always check labels."
  allergy_checks: "Allergy checks are done by plain, tested rules over confirmed data, not by the AI."
  unverified: "Store-bought or unknown: can't verify the ingredients. Check the label."
  cross_contact: "For severe allergies, watch for cross-contact: shared boards, pans, oil and utensils, and 'may contain' warnings on labels."
  photo_reaction: "Photo reactions are a cook's reaction, not a check of your food or its safety."
  not_medical: "Kitchen Quest is a cooking game and food log, not medical advice. For symptoms, diagnoses or treatment, talk to a clinician."
  journey: "Diet journeys are tools to use with a clinician, not medical advice."
  ai_answers: "Live answers are written by AI, in character. Not medical advice."
  scripted_answers: "Scripted answers (AI not connected). Not medical advice."
  draft_recipe: "Draft recipe: not yet reviewed by a cook from this tradition."
  emergency: "If you're having an allergic reaction now, call your local emergency number."
  # C-16, verbatim. Shown wherever the Pan or a cook can answer with AI.
  ai_characters: "The Pan and the cooks are AI characters. Don't rely on them for medical advice."
