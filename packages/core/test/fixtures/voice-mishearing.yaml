# M7 Step 1 (D2, §12): the mishearing test set that gates core `heardCheck`. Every entry is a health-worded utterance
# (`said`) as speech-to-text got it (`heard`). The gate needs a heard term whose words are exactly `heardWord`, spelled
# by core `spell`, and, when `saidId` is set, offering that graph id (as the term itself or an alternative).
#
# `holdout: true` rows were never used to tune `phoneticKey`, the stop list or KNOWN_CONFUSIONS. If one fails, it is
# reported to the controller, never tuned on. Never weaken or delete an entry.
# `source`: `spike §2` for mishearings observed in docs/spikes/2026-11-09-voice-latency.md §2, else `synthetic`.
# `plain`: utterances with no food, rule term or health wording; none may get a heard check.
