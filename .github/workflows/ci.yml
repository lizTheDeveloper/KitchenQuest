name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/lint/package-lock.json
      - run: npm ci
      - run: npm run lint:install
      - run: npm run lint
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kitchenquest_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/kitchenquest_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/lint/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      # apps/voice's lint-guard test reads tools/lint's ESLint and fails under CI without it (M7 Step 2, F1).
      - run: npm run lint:install
      - run: npm run typecheck
      - run: npm test
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # CI runners only: this installs the Chromium that matches the pinned playwright-core (1.63.0, see the
      # root package.json overrides). Never run it locally; the dev container ships its own Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck -w @kitchenquest/game
      - run: npm test -w @kitchenquest/game
      - run: npm run build -w @kitchenquest/game
      - run: npm run test:e2e -w @kitchenquest/game
  # M7: the voice service. Fake engines and the worker's stdlib-only echo engine (python3 -I -S): CI has no GPU, no
  # microphone and no model weights, never installs worker/requirements.txt and never runs the benchmark.
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/lint/package-lock.json
      - run: npm ci
      # The lint-guard test reads the real ESLint config from tools/lint (fix round 2, N6).
      - run: npm run lint:install
      - run: python3 --version
      - run: npm run typecheck -w @kitchenquest/voice
      - run: npm test -w @kitchenquest/voice
